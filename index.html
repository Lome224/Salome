<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salome Yichi Zhang · Creative Technologist, Researcher, Composer</title>
<meta name="description" content="Salome Yichi Zhang: creative technologist, researcher and composer working across kinetic sound sculpture, generative sound, music cognition and film.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bri:.57; --sat:1.4; --con:1.14; --icon:.55;
  --rx:16px; --ry:60vh;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --sys:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --glass:linear-gradient(to bottom, rgba(255,255,255,.22), rgba(255,255,255,.06) 50%, rgba(255,255,255,.02) 51%, rgba(255,255,255,.08));
  --glass-edge:rgba(255,255,255,.25);
  --glow:linear-gradient(to bottom, rgba(255,226,150,.30), rgba(255,206,110,.12) 50%, rgba(255,196,90,.08) 51%, rgba(255,214,120,.16));
  --glow-edge:rgba(255,222,150,.55);
  --dark:linear-gradient(to bottom, rgba(110,110,110,.86), rgba(45,45,45,.86) 50%, rgba(20,20,20,.86) 51%, rgba(38,38,38,.86));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--mono);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}

/* backdrop */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;
  filter:brightness(var(--bri)) saturate(var(--sat)) contrast(var(--con));background:#000}

/* shared glass */
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);
  transition:background .25s, border-color .25s, box-shadow .25s, color .25s}
.glowable:hover,.glowable:focus-visible,.icon:hover .label,.icon:focus-visible .label{
  background:var(--glow);border-color:var(--glow-edge);color:#fff6dc;outline:none;
  box-shadow:inset 0 1px 0 rgba(255,244,210,.55), 0 0 18px rgba(255,200,90,.32)}

/* banner */
.banner{position:fixed;left:16px;right:16px;top:14px;height:30px;z-index:20;overflow:hidden;cursor:default;
  display:flex;align-items:center;user-select:none}
.banner .track{display:flex;white-space:nowrap;animation:scroll 60s linear infinite;will-change:transform}
.banner .track span{padding-right:0;font-size:14px;letter-spacing:.02em}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* desktop */
.icons{position:fixed;right:16px;top:62px;bottom:16px;width:132px;z-index:5;display:flex;flex-direction:column;
  align-items:center;gap:14px;overflow-y:auto;transition:opacity .25s}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;background:none;border:0;padding:0;
  cursor:pointer;text-decoration:none}
.icon img{width:96px;height:72px;object-fit:contain;transition:transform .2s;
  filter:contrast(calc(1 - var(--icon) * .6)) brightness(calc(1 + var(--icon) * .35))}
.icon:hover img{transform:translateY(-2px)}
.icon .label{width:100%;padding:3px 0;text-align:center;font-size:13px}

/* windows */
.win{position:fixed;z-index:10;border:1px solid #000;border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,.84);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 12px 34px rgba(0,0,0,.7);color:#111;text-shadow:none}
.win .bar{position:relative;height:26px;display:flex;align-items:center;justify-content:center;
  background:var(--dark);border-bottom:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  color:#fff;text-shadow:0 1px 1px #000;font-size:12px;letter-spacing:.04em;user-select:none}
.win .dot,.win .x{position:absolute;left:9px;top:6px;width:13px;height:13px;border-radius:50%;border:1px solid #000;
  background:radial-gradient(circle at 35% 30%, #fff, #bdbdbd 45%, #3a3a3a);padding:0;cursor:pointer}
.win .x:hover{background:radial-gradient(circle at 35% 30%, #fff8e0, #f0c66a 45%, #6b4a10)}
.win .body{padding:14px 16px;overflow:auto}

#readme{left:var(--rx);top:var(--ry);width:min(600px, calc(100vw - 200px));transition:opacity .25s}
#readme .bar{cursor:grab}
#readme.dragging .bar{cursor:grabbing}
#readme .body{font-size:13.5px;line-height:1.55}
#readme p{margin:0 0 1em}#readme p:last-child{margin:0}

#panel{left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);opacity:0;pointer-events:none;
  width:min(600px, 92vw);max-height:80vh;display:flex;flex-direction:column;transition:opacity .2s, transform .2s}
#panel.wide{width:min(860px, 94vw)}
#panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#panel .body{font-size:12px;line-height:1.45}
body.has-window #readme,body.has-window .icons{opacity:0;pointer-events:none}

.rows{border-top:1px solid rgba(0,0,0,.75)}
.row{display:grid;grid-template-columns:6fr 2fr 4fr;gap:8px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.75)}
.row .y{text-align:center}.row .r{text-align:right}
.row .m{opacity:.65}
.sub{margin:18px 0 6px;font-weight:500;letter-spacing:.06em}
/* clickable work titles in folder lists */
.row a.wl{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(0,0,0,.45)}
.row a.wl:hover{background:rgba(255,206,110,.35);box-shadow:0 0 0 3px rgba(255,206,110,.35);border-radius:3px;border-bottom-color:transparent}
/* work page (third layer) */
.work h2{margin:2px 0 4px;font-size:20px;letter-spacing:.01em}
.work .meta{margin:0 0 14px;opacity:.7}
.work .vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:4px 0 16px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.work .vid iframe,.work .vid video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
.work figure.side img{max-height:46vh}
.work figure a{display:inline-block;cursor:zoom-in}
.work figure{margin:4px 0 16px;text-align:center}
.work figure img{max-width:100%;max-height:62vh;border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.25)}
.work figure figcaption{font-size:11.5px;opacity:.6;margin-top:6px}
.work .facts{margin:14px 0;padding:10px 0;border-top:1px solid rgba(0,0,0,.75);border-bottom:1px solid rgba(0,0,0,.75);
  display:grid;grid-template-columns:7em 1fr;gap:6px 12px;font-size:12.5px}
.work .facts dt{opacity:.6}.work .facts dd{margin:0}
.work .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.work .tags span{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid rgba(0,0,0,.35);background:rgba(255,255,255,.35)}
.work .wa{margin:16px 0 6px}
.work .wa .track-row{grid-template-columns:minmax(0,1fr) minmax(190px,15em)}
.work .wd{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.work .wd .lr-link{margin:0}
.work .soon{opacity:.55;font-style:italic;margin:12px 0}
.work .pdf{height:min(78vh,900px);margin:6px 0 8px;border-radius:8px;overflow:hidden;background:#fff;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.55),0 6px 18px rgba(0,0,0,.18)}
.work .pdf iframe{width:100%;height:100%;border:0;display:block}
.work .pdfcap{margin:12px 0 2px;font-size:12.5px;opacity:.75}
/* write-up sections */
.work .sec2{margin:22px 0 8px;padding-top:12px;border-top:1px solid rgba(0,0,0,.75)}
.work .sec2 h3{margin:0 0 8px;font-size:14px;letter-spacing:.04em}
.work .sec2 h4{margin:16px 0 6px;font-size:12.5px;letter-spacing:.06em;opacity:.75;text-transform:uppercase}
.work .sec2 ul{margin:6px 0;padding-left:18px}.work .sec2 li{margin:3px 0}
.work .sec2 code{font-size:11.5px;padding:0 4px;border-radius:4px;background:rgba(255,255,255,.55);border:1px solid rgba(0,0,0,.15)}
.work .credits{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;font-size:12.5px;margin:8px 0}
.work .credits dt{opacity:.6}.work .credits dd{margin:0}
.work .flow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px;margin:10px 0 6px}
.work .flow .n{flex:1 1 120px;min-width:110px;padding:8px 10px;border-radius:10px;border:1px solid rgba(0,0,0,.45);
  background:linear-gradient(rgba(255,255,255,.7),rgba(0,0,0,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.85);font-size:11.5px;line-height:1.35}
.work .flow .n b{display:block;font-size:12px;margin-bottom:2px}
.work .flow .n.me{border-color:rgba(160,110,20,.7);background:linear-gradient(rgba(255,236,190,.65),rgba(255,206,110,.2))}
.work .flow .a{align-self:center;opacity:.55;font-size:14px}
.work .gcard .geb{font-size:11px;letter-spacing:.12em;text-transform:uppercase;opacity:.6;margin:0 0 2px}
.work .gcard h3{font-size:17px;letter-spacing:.01em;margin-bottom:10px}
.work .gcard .gq{font-size:15px;line-height:1.45;font-weight:600;margin:4px 0 12px}
.work .gcard figure.g{margin:10px 0 6px;text-align:center}
.work .gcard figure.g img,.work .gcard figure.g video{max-width:100%;max-height:62vh;border-radius:8px;display:inline-block;
  box-shadow:0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.22)}
.work .gcard .gpair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.work .gcard .gpair figure.g img{max-height:48vh;width:100%;object-fit:cover}
.work .gcard p.gcap{font-size:11.5px;opacity:.7;margin:2px 0 12px;text-align:center}
.work .sec2.divider{margin-top:34px;padding-top:16px;border-top:3px double rgba(0,0,0,.6)}
.work .sec2.divider h3{font-size:16px}
.work figure.svgfig{margin:10px 0 14px;padding:12px 12px 8px;border-radius:10px;background:rgba(255,255,255,.38);
  border:1px solid rgba(0,0,0,.18);text-align:left;font-size:11px}
.work figure.svgfig svg{font-family:inherit}
.work figure.svgfig figcaption{margin-top:4px}
.work table.map{width:100%;border-collapse:collapse;font-size:12px;margin:6px 0}
.work table.map td,.work table.map th{padding:6px 8px;border-bottom:1px solid rgba(0,0,0,.25);text-align:left;vertical-align:top}
.work table.map th{font-weight:500;opacity:.65}
@media (max-width:600px){.work .flow .a{transform:rotate(90deg);flex-basis:100%;text-align:center}
  .work figure.svgfig{overflow-x:auto;-webkit-overflow-scrolling:touch}.work figure.svgfig svg{min-width:620px}}
.lr-link{display:inline-block;margin:2px 0 14px;padding:4px 12px;border-radius:999px;text-decoration:none;
  border:1px solid rgba(0,0,0,.6);background:rgba(0,0,0,.06)}
.lr-link:hover{background:rgba(255,206,110,.35);border-color:rgba(160,110,20,.7)}
.track-row{display:grid;grid-template-columns:2.2em minmax(0,1fr) minmax(190px,15em) minmax(9em,1.25fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.75)}
.play{border:1px solid rgba(0,0,0,.6);border-radius:999px;background:rgba(0,0,0,.06);padding:3px 10px;cursor:pointer;font-size:11px}
.play:hover{background:rgba(255,206,110,.35)}
.play[disabled]{opacity:.35;cursor:default}
.pl{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 3px;border-radius:999px;
  border:1px solid rgba(0,0,0,.45);background:linear-gradient(rgba(255,255,255,.55),rgba(0,0,0,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.pl.on{border-color:rgba(160,110,20,.7);background:linear-gradient(rgba(255,236,190,.55),rgba(255,206,110,.18))}
.pl .pb{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.55);cursor:pointer;padding:0;
  background:radial-gradient(circle at 50% 30%,#4a4a4a,#0d0d0d 70%);color:#eee;font-size:9px;line-height:20px;text-align:center}
.pl .pb:hover{box-shadow:0 0 8px 2px var(--glow,rgba(255,214,120,.55))}
.pl .bar{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.18);position:relative;cursor:pointer;touch-action:none}
.pl .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(#5a5a5a,#111)}
.pl .bar::after{content:'';position:absolute;inset:-8px 0}
.pl .t{flex:none;font-size:11px;font-variant-numeric:tabular-nums;opacity:.8;min-width:5.6em;text-align:right}
.pl.bad{opacity:.4}
.track-row > div:last-child{font-size:11.5px;line-height:1.35;opacity:.85}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px}
.about img{width:100%;border-radius:4px;display:block}
.about.nophoto{grid-template-columns:1fr}
.about h2{font-size:15px;margin:0 0 2px}
.about .roles{font-style:italic;margin:0 0 12px}
.about p{margin:0 0 10px}
.sec{margin-top:16px;padding-top:12px;border-top:1px solid rgba(0,0,0,.75)}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.ent{display:grid;grid-template-columns:7em 1fr;gap:10px;margin-bottom:10px}
.ent ul{margin:4px 0 0;padding-left:1.1em}
.cvlink{display:inline-block;margin-top:16px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.contact .k{opacity:.6;margin-bottom:4px}

/* bottom controls */
.controls{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;gap:8px}
.controls button{padding:5px 12px;font-size:11px;letter-spacing:.12em;cursor:pointer}
#codepanel{position:fixed;left:16px;bottom:56px;z-index:30;display:none;width:min(560px, calc(100vw - 32px));
  max-height:min(62vh,560px);overflow:auto;margin:0;padding:12px 14px;font-size:10.5px;line-height:1.5;color:#111;
  white-space:pre;border-radius:8px}
#codepanel .c{color:#8a8a8a}

/* enter screen */
#enter{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;letter-spacing:.08em;transition:opacity .7s}
#enter .go{padding:10px 30px;font-size:13px;letter-spacing:.25em;cursor:pointer}
#enter .sub{opacity:.6;letter-spacing:.04em;margin:0;font-weight:400}
#enter .skip{background:none;border:0;opacity:.5;text-decoration:underline;cursor:pointer;font-size:12px}
#enter .note{opacity:.6;min-height:1em;font-size:12px}

/* tuning panel */
#tune{position:fixed;right:16px;bottom:16px;z-index:40;width:270px;padding:10px 12px;border-radius:8px;
  background:#fff;color:#000;border:1px solid #000;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:11px;line-height:1.5;display:none}
#tune h4{margin:6px 0 4px;font-weight:500;letter-spacing:.14em;font-size:11px}
#tune label{display:flex;align-items:center;gap:8px;margin:3px 0}
#tune label span{width:90px}#tune input{flex:1}
#tune output{display:block;margin-top:8px;padding-top:6px;border-top:1px solid #000}

/* phones and small windows */
@media (max-width:600px){
  html,body{overflow:auto}
  .banner{position:sticky;top:0;left:0;right:0;margin:10px 10px 0}
  .icons{position:static;width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:14px 10px;gap:10px;overflow:visible}
  .icon{width:96px}.icon img{width:72px;height:56px}
  #readme{position:relative;left:auto;top:auto;width:auto;margin:12px}
  #readme .bar{cursor:default}
  #panel{width:94vw;max-height:84vh}
  .row{grid-template-columns:1fr auto}.row .r{grid-column:1 / -1;text-align:left;opacity:.75}
  .about{grid-template-columns:1fr}
  .controls{position:fixed}
}
@media (prefers-reduced-motion:reduce){.banner .track{animation:none}}
</style>
</head>
<body>
<video id="bg" muted loop playsinline autoplay preload="auto"></video>

<header class="banner glass" id="banner" aria-label="Salome Yichi Zhang · Creative Technologist · Researcher · Composer">
  <div class="track" id="track"></div>
</header>

<section class="win" id="readme" aria-label="Artist statement">
  <div class="bar" id="readmeBar"><span class="dot" aria-hidden="true"></span>readme.txt</div>
  <div class="body" id="statement"></div>
</section>

<nav class="icons" id="icons" aria-label="Sections"></nav>

<section class="win" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
  <div class="bar"><button class="x" id="close" aria-label="Close"></button><span id="panelTitle"></span></div>
  <div class="body" id="panelBody"></div>
</section>

<div class="controls">
  <button class="glass glowable" id="snd" type="button">SOUND OFF</button>
  <button class="glass glowable" id="binBtn" type="button" title="Binaural 3D sound (HRTF). Best with headphones; switch off for speakers.">3D ON</button>
  <button class="glass glowable" id="codeBtn" type="button">CODE</button>
</div>
<pre class="win" id="codepanel"></pre>

<div id="enter">
  <button class="go glass glowable" id="go" type="button">ENTER</button>
  <p class="sub">Sound on. Best with headphones.</p>
  <button class="skip" id="skip" type="button">enter without sound</button>
  <div class="note" id="note"></div>
</div>

<div id="tune">
  <h4>BACKDROP</h4>
  <label><span>Brightness</span><input type="range" min="0" max="1" step=".01" data-k="bri"></label>
  <label><span>Colour</span><input type="range" min="0" max="1.5" step=".01" data-k="sat"></label>
  <label><span>Contrast</span><input type="range" min=".5" max="2" step=".01" data-k="con"></label>
  <h4>INTERFACE</h4>
  <label><span>Icon grey</span><input type="range" min="0" max="1" step=".01" data-k="icon"></label>
  <h4>STATEMENT</h4>
  <div>Drag the readme.txt bar to move it.</div>
  <output id="tuneOut"></output>
</div>

<script type="text/plain" id="csd"><CsoundSynthesizer>
<CsOptions>
-odac -d -m0
</CsOptions>
<CsInstruments>
sr = 48000
ksmps = 64
nchnls = 2
0dbfs = 1
seed 0

gaDryL init 0
gaDryR init 0
gaRevL init 0
gaRevR init 0

; ---------- binaural (HRTF) ----------
; Measured head-related transfer functions (Csound's data set for the running
; sample rate: 44.1, 48 or 96 kHz). Sources are placed around the listener's head;
; "bin" = 1 for binaural, 0 for plain stereo.
gSHL sprintf "hrtf-%d-left.dat", sr
gSHR sprintf "hrtf-%d-right.dat", sr

; ---------- binaural room ----------
; Four room buses, one per quarter around the listener (front-right, back-right,
; back-left, front-left). Each feeds an hrtfearly room model, so a sound's wall,
; floor and ceiling reflections arrive from its own side of the room. A shared
; hrtfreverb gives the binaural late tail.
gaQ1 init 0
gaQ2 init 0
gaQ3 init 0
gaQ4 init 0

opcode RoomSend, 0, akk
  asig, kaz, kamt xin
  k1 = cos((kaz - 45)*$M_PI/180)
  k2 = cos((kaz - 135)*$M_PI/180)
  k3 = cos((kaz - 225)*$M_PI/180)
  k4 = cos((kaz - 315)*$M_PI/180)
  k1 = (k1 < 0 ? 0 : k1)
  k2 = (k2 < 0 ? 0 : k2)
  k3 = (k3 < 0 ? 0 : k3)
  k4 = (k4 < 0 ? 0 : k4)
  gaQ1 = gaQ1 + asig*k1*kamt
  gaQ2 = gaQ2 + asig*k2*kamt
  gaQ3 = gaQ3 + asig*k3*kamt
  gaQ4 = gaQ4 + asig*k4*kamt
endop

; D major pentatonic, two octaves (semitones from root)
giScale ftgen 0, 0, -8, -2, 0, 2, 4, 7, 9, 12, 14, 16

; ---------- conductor: decides when drops and harmonic tides happen ----------
instr 1
  kTime timeinsts
  kNextDrop init 0.2
  kNextPad init 0
  kNextSh init 3
  kSlow oscili 0.5, 1/97
  kSlow = kSlow + 0.5
  if kTime >= kNextDrop then
    kdur random 1.4, 3.8
    event "i", 2, 0, kdur
    kc random 0, 1
    if kc > 0.86 then
      event "i", 2, 0.08, kdur*0.8
      event "i", 2, 0.19, kdur*0.6
    endif
    kgap random 0.25, 2.6
    kNextDrop = kTime + kgap*(1.7 - 1.25*kSlow)
  endif
  if kTime >= kNextPad then
    kpd random 42, 62
    kr1 random 0, 4.99
    kr2 random 0, 7.99
    kr3 random 0, 7.99
    kn1 table int(kr1), giScale
    kn2 table int(kr2), giScale
    kn3 table int(kr3), giScale
    event "i", 4, 0, kpd, 38 + kn1
    event "i", 4, 0.7, kpd, 50 + kn2
    event "i", 4, 1.6, kpd, 57 + kn3
    kgp random 24, 36
    kNextPad = kTime + kgp
  endif
  ; shimmer: a sparkling source that circles the head
  if kTime >= kNextSh then
    ksd random 14, 22
    event "i", 5, 0, ksd
    ksg random 25, 45
    kNextSh = kTime + ksg
  endif
endin

; ---------- droplet: bubble chirp + inharmonic porcelain partials ----------
instr 2
  irnd random 0, 7.99
  isemi table int(irnd), giScale
  ; pitch varies over three octaves (lower ones more likely), slightly detuned each time
  io random 0, 1
  ioct = (io < 0.4 ? 0 : (io < 0.8 ? 1 : 2))
  idet random -0.3, 0.3
  ifreq = cpsmidinn(62 + isemi + 12*ioct + idet)
  iamp random 0.04, 0.13
  ; stereo placement: 30% toward left or right, side chosen at random per drop
  iside random 0, 1
  ipan = (iside > 0.5 ? 0.65 : 0.35)
  ; binaural placement: anywhere around the head, a little above ear level,
  ; drifting downward as it rings, like a drop falling past you
  iaz random 0, 360
  iel random -5, 50
  kel line iel, p3, iel - 30
  ; each drop also travels 50-130 degrees around you while it rings
  itrav random 50, 130
  itd random 0, 1
  itrav = (itd > 0.5 ? itrav : -itrav)
  kaz line iaz, p3, iaz + itrav
  kaz wrap kaz, 0, 360
  ; distance: near drops are louder and dry, far drops quieter and wetter
  inear random 0, 1
  igain = 0.55 + 1.1*inear
  idry = 0.35 + 0.9*inear
  iwet = 0.95 - 0.7*inear
  kf expseg ifreq*0.62, 0.035, ifreq, p3-0.035, ifreq*1.015
  aenv expseg 0.0001, 0.004, 1, p3-0.004, 0.0001
  aen2 expseg 0.0001, 0.003, 1, p3*0.35, 0.0001, p3*0.65, 0.0001
  a1 poscil aenv, kf
  a2 poscil aen2*0.2, kf*2.756
  a3 poscil aen2*0.08, kf*5.404
  asig = (a1 + a2 + a3) * iamp
  kbin chnget "bin"
  kbin port kbin, 0.3
  ; high cut: soft (3.75 kHz) in stereo; opened up in 3D, because the
  ; ear's direction cues (above / behind / in front) live above 4 kHz
  kcut chnget "cut"
  kcut = (kcut < 200 ? 3750 : kcut)
  kcut = kcut + (11000 - kcut)*kbin
  asig butlp asig, kcut
  asig butlp asig, kcut
  ; a tiny bright tick at the start of each drop gives the ear an exact position
  atk expseg 1, 0.006, 0.0001, p3-0.006, 0.0001
  an noise 1, 0
  an buthp an, 2500
  asig = asig + an*atk*iamp*0.5*kbin
  aSL, aSR pan2 asig, ipan
  aBL, aBR hrtfmove2 asig*igain, kaz, kel, gSHL, gSHR, 4, 9, sr
  aL = aSL*(1-kbin) + aBL*kbin*1.4
  aR = aSR*(1-kbin) + aBR*kbin*1.4
  RoomSend asig*igain, kaz, (0.6 + 0.8*(1-inear))*kbin
  kdry = 0.3 + (idry - 0.3)*kbin
  kwet = 0.85 + (iwet - 0.85)*kbin
  gaDryL = gaDryL + aL*kdry
  gaDryR = gaDryR + aR*kdry
  gaRevL = gaRevL + aL*kwet
  gaRevR = gaRevR + aR*kwet
endin

; ---------- water: band-passed noise breathing like waves ----------
instr 3
  kw1 oscili 1, 1/11.3
  kw2 oscili 1, 1/17.9
  kw3 oscili 1, 1/61
  kamp = 0.55 + 0.25*kw1 + 0.2*kw2
  kamp port kamp, 0.4
  kcf = 380 + 700*kamp + 250*kw3
  aNL noise 0.5, 0.7
  aNR noise 0.5, 0.7
  aL butbp aNL, kcf, kcf*0.7
  aR butbp aNR, kcf*1.07, kcf*0.7
  aSh noise 0.04, 0
  aSh butbp aSh, 3200 + 800*kw2, 1500
  kgain = kamp*kamp*0.9
  aL = aL*kgain + aSh*kamp*0.3
  aR = aR*kgain + aSh*kamp*0.3
  ; slow wave-like drift between left and right (about 26 s per cycle)
  kwp oscili 0.36, 1/26
  kwpan = 0.5 + kwp
  aL = aL * sqrt(2*(1-kwpan))
  aR = aR * sqrt(2*kwpan)
  kbw chnget "bin"
  kbw port kbw, 0.3
  kwg = 1 - 0.4*kbw
  gaDryL = gaDryL + aL*0.55*kwg
  gaDryR = gaDryR + aR*0.55*kwg
  gaRevL = gaRevL + aL*0.35*kwg
  gaRevR = gaRevR + aR*0.35*kwg
endin

; ---------- tide: slow sine chord tones that swell and fade ----------
instr 4
  ifreq = cpsmidinn(p4)
  ; each chord tone drifts slowly from one side to the other over its life
  iside random 0, 1
  ioff random 0.28, 0.42
  ipanA = (iside > 0.5 ? 0.5 - ioff : 0.5 + ioff)
  ipanB = 1 - ipanA
  kpan line ipanA, p3, ipanB
  ; binaural: each tone travels 60-140 degrees around the head over its life
  iaz0 random 0, 360
  isweep random 150, 300
  idir random 0, 1
  isweep = (idir > 0.5 ? isweep : -isweep)
  kaz line iaz0, p3, iaz0 + isweep
  kaz wrap kaz, 0, 360
  iel random -10, 25
  iatt = p3*0.4
  aenv linseg 0, iatt, 1, p3-2*iatt, 1, iatt, 0
  irate random 0.05, 0.2
  kdrift oscili 0.0025, irate
  ktone oscili 0.5, 1/23
  a1 poscil 1, ifreq*(1+kdrift)
  a2 poscil 0.7, ifreq*1.004
  a3 poscil 0.25, ifreq*2.003
  a4 poscil 0.08, ifreq*3.01
  kbin chnget "bin"
  kbin port kbin, 0.3
  ; airy upper shimmer (only in 3D): gives the ear something above 2 kHz to track
  aair noise 1, 0
  aair butbp aair, ifreq*8, ifreq*1.5
  aair = aair * (0.5 + 0.5*ktone) * 0.35 * kbin
  asig = (a1 + a2 + (a3 + a4)*(0.6 + ktone) + aair) * aenv * 0.04
  aSL, aSR pan2 asig, kpan
  aBL, aBR hrtfmove2 asig, kaz, iel, gSHL, gSHR, 4, 9, sr
  RoomSend asig, kaz, 0.7*kbin
  aL = aSL*(1-kbin) + aBL*kbin*1.25
  aR = aSR*(1-kbin) + aBR*kbin*1.25
  gaDryL = gaDryL + aL*0.6
  gaDryR = gaDryR + aR*0.6
  gaRevL = gaRevL + aL*0.5
  gaRevR = gaRevR + aR*0.5
endin

; ---------- shimmer: sparkles circling the head ----------
instr 5
  ; one or two full turns around the listener, rising and dipping
  iaz random 0, 360
  iturns random 1, 2
  idir random 0, 1
  iturns = (idir > 0.5 ? iturns : -iturns)
  kaz line iaz, p3, iaz + 360*iturns
  kaz wrap kaz, 0, 360
  kel oscili 25, 1/7.3
  kel = kel + 15
  aenv linseg 0, p3*0.25, 1, p3*0.5, 1, p3*0.25, 0
  ; sparse bright grains, tuned to the scale
  irnd random 0, 7.99
  isemi table int(irnd), giScale
  ifreq = cpsmidinn(86 + isemi)
  kdens randomi 9, 22, 0.5
  agr dust2 1, kdens
  ar1 reson agr, ifreq, ifreq*0.02, 1
  ar2 reson agr, ifreq*2.01, ifreq*0.03, 1
  ahi buthp agr, 5000
  asig = (ar1*0.6 + ar2*0.3 + ahi*0.25) * aenv * 0.35
  kbin chnget "bin"
  kbin port kbin, 0.3
  ; stereo: follow the same circle with a simple pan
  kpan = 0.5 + 0.45*sin(kaz*$M_PI/180)
  aSL, aSR pan2 asig*0.6, kpan
  aBL, aBR hrtfmove2 asig, kaz, kel, gSHL, gSHR, 4, 9, sr
  RoomSend asig, kaz, 0.8*kbin
  aL = aSL*(1-kbin) + aBL*kbin*1.4
  aR = aSR*(1-kbin) + aBR*kbin*1.4
  gaDryL = gaDryL + aL*0.7
  gaDryR = gaDryR + aR*0.7
  gaRevL = gaRevL + aL*0.25
  gaRevR = gaRevR + aR*0.25
endin

; ---------- room: binaural early reflections + late tail ----------
; Listener stands in the middle of a 10 x 10 x 3 m room (+x = right, +y = ahead);
; each bus sounds from 2.2 m away in its quarter.
instr 98
  ir = 2.2
  ic = 5
  ih = 1.7
  ip = ir*0.7071
  a1L, a1R, ilo, ihi, imfp hrtfearly gaQ1, ic+ip, ic+ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  a2L, a2R, i0, i1, i2 hrtfearly gaQ2, ic+ip, ic-ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  a3L, a3R, i3, i4, i5 hrtfearly gaQ3, ic-ip, ic-ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  a4L, a4R, i6, i7, i8 hrtfearly gaQ4, ic-ip, ic+ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  aEL = a1L + a2L + a3L + a4L
  aER = a1R + a2R + a3R + a4R
  ; late tail: binaural diffuse reverb, longer than the room's own decay for a dreamy wash
  aTin = (gaQ1 + gaQ2 + gaQ3 + gaQ4)*0.5
  aTL, aTR, idel hrtfreverb aTin, 3.2, 1.6, gSHL, gSHR, sr, imfp, 1
  aTL delay aTL, idel
  aTR delay aTR, idel
  gaDryL = gaDryL + aEL*2.2 + aTL*1.1
  gaDryR = gaDryR + aER*2.2 + aTR*1.1
  clear gaQ1, gaQ2, gaQ3, gaQ4
endin

; ---------- master: reverb, volume, fade-in, soft limit ----------
instr 99
  kvol chnget "vol"
  kvol port kvol, 0.25
  kfade linseg 0, 1.5, 1
  kbm chnget "bin"
  kbm port kbm, 0.3
  aRL, aRR reverbsc gaRevL, gaRevR, 0.9 - 0.08*kbm, 7000 + 4000*kbm
  krv = 0.9 - 0.55*kbm
  ; loudness match: the binaural mix measures quieter, so lift it to stereo level
  kmk = 1 + 0.8*kbm
  aL = (gaDryL + aRL*krv) * kvol * kfade * kmk
  aR = (gaDryR + aRR*krv) * kvol * kfade * kmk
  aL = tanh(aL)
  aR = tanh(aR)
  krms rms aL + aR
  chnset krms, "level"
  outs aL, aR
  clear gaDryL, gaDryR, gaRevL, gaRevR
endin

     {
      "title": "The Boston, USA Transit Experience",
      "html": "<p>Since moving to Boston for our degree, we have used public transportation almost daily. Spending so much time on trains and other transit systems has shaped our perspective on city design and on liminal spaces. Public transportation is not only a means of moving from one place to another; it is a shared environment where people coexist, interact, and experience the city together. The rhythm of train travel has prompted us to reflect on movement, infrastructure, and the human experience of urban life.</p><p>In addition, recent social tensions in the United States, the country where we now live, and the debates surrounding deportation policies under the current presidential administration (Donald Trump, 2025–2029) have heightened our awareness of how fragile the structures of everyday life can be. When we ride the train, our minds often drift. It is one of the rare stretches of continuous time when we overthink, observe, or quietly dissociate. We think about the people around us—their lives, their stories, and the invisible worlds they carry.</p><div class=\"gpair\"><figure class=\"g\"><a href=\"media/works/cl/cl-boston-red-line.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-boston-red-line.jpg\" alt=\"Inside a Boston MBTA Red Line car\" loading=\"lazy\"></a></figure><figure class=\"g\"><a href=\"media/works/cl/cl-boston-subway.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-boston-subway.jpg\" alt=\"A passenger reading on a Boston subway ride\" loading=\"lazy\"></a></figure></div><p class=\"gcap\">Left: The red line,  Boston MBTA, 2025</p><p class=\"gcap\">Right: Moment of Boston subway ride</p><p>This awareness drives us to reflect on how design—whether through architecture, public spaces, or media—can serve as a tool for visibility, connection, and resilience.</p>",
      "gamma": true
     },
     {
      "title": "Public Transportation and Social Equity",
      "html": "<div class=\"geb\">Why This Matters</div><p>According to Juliana Jurado, architect, interior designer and content creator, \"The worst enemy of inequality is public transportation. A good public transportation system is economical, fast, punctual, safe, and connects a large part of the city. Most importantly, it reduces people's travel time.\"</p><h4>Quality of Life</h4><p>Free time allows us to access a better quality of life, and reinvesting that time in other activities can lead to progress in other social dimensions.</p><h4>Environmental Impact</h4><p>If public transportation is used more, car use is reduced, reducing city traffic and gas emissions, which also leads to better air quality.</p><h4>Social Connection</h4><p>Public spaces shape human interactions, access to opportunities, and the rhythm of daily life.</p><p>We wanted our project to be artistic, interactive, and engaging—something that invites play, exploration, and aesthetic appreciation, while also addressing deeper social questions and telling stories that are meaningful to us and to the communities we are connected to.</p><p>We believe that public spaces, especially transportation systems, are not only functional but deeply cultural. They shape human interactions, access to opportunity, and the rhythm of daily life. Design is a powerful tool for making these spaces more inclusive, engaging, and meaningful. By combining architecture, art, technology, and storytelling, we seek to explore the intersection of movement, connection, and urban experience in a way that is both visually compelling and socially relevant. We aim to contribute to more humane cities—where design fosters connection rather than isolation, and where technology does not replace human encounter but instead enriches it.</p>",
      "gamma": true
     },
     {
      "title": "Research Framework",
      "html": "<h4>Central Question</h4><p class=\"gq\">How can an interactive sensory installation transform the emotional perception of public transportation, turning an everyday transit space into a restorative and humane refuge?</p><h4>Sub-Questions</h4><h4>Sensory Stimuli</h4><p>What role do sensory stimuli (light, sound, touch) play in generating calm and introspection in transit spaces?</p><h4>Interaction Design</h4><p>How can interaction (touching the handlebars) reinforce a sense of ownership and privacy in a shared environment?</p><h4>Real-World Application</h4><p>What lessons can be transferred from the art installation to a real-life public transportation context?</p><h4>Objectives</h4><h4>General Objective</h4><p>To explore, through an immersive installation, how sensory design and interactive technology can redefine the experience of train travel, promoting the emotional well-being of users.</p><h4>Specific Objectives</h4><ul><li>To design an immersive space that contrasts with the harsh aesthetics of traditional train cars, using semi-translucent fabrics, projections, and soundscapes.</li><li>To integrate a tactile interaction system that allows visitors to activate visual and aural transformations inspired by neuroarchitectural principles.</li><li>To assess visitors' perceptions of calm, intimacy, and personal connection during the experience.</li><li>To reflect on the applicability of the results in broader urban contexts, such as stations or real-life transportation systems.</li></ul>",
      "gamma": true
     },
     {
      "title": "Design Principles and Research",
      "html": "<div class=\"geb\">Theoretical Foundation</div><p>The installation was structured around several interdisciplinary frameworks that informed both the conceptual approach and the practical design decisions:</p><h4>Neuroarchitecture</h4><p>Neuroarchitecture (a term that may come from the book Neuroarchitecture: Learning Through Space by Ana Mombiedro Lozano) refers to an interdisciplinary field that studies how built environments influence human cognition, emotions, and behavior by blending neuroscience with architectural design principles. It seeks to create spaces that promote well-being and enhance experiences by applying an understanding of how design elements like natural light, room layout, and textures affect the brain.</p><h4>Restorative Design</h4><p>For its part, restorative design is a holistic design philosophy focused on creating built environments that actively improve human well-being and restore ecological integrity, rather than just minimizing harm. (The Role of Restorative Design in the Achieving Principles of Industry 5.0, Monika Klein, Ewelina Gutowska) Both are fields that focus on creating environments that promote well-being and mental health.</p><h4>Soundscape Design</h4><p>Soundscape design, the artistic process of creating, modifying, or enhancing the acoustic environment of a place, using desired and unwanted sounds to communicate and express, in order to create a specific atmosphere that affects the perception and well-being of the environment or the listener (How can you design soundscapes for urban environments? by Víctor Martín), also plays a crucial role in creating spaces that positively influence our sensory experience.</p><h4>Third Places</h4><p>In this context, \"third places,\" a concept coined by urban sociologist Ray Oldenburg in his 1989 book \"The Great Good Place,\" refer to community spaces that are neither home nor work, but rather places of encounter and social connection that foster cohesion and a sense of community. Providing a vital space for social and community connection, highlighting the importance of considering the intersection of design, psychology, and community in creating spaces that support human health and well-being and being a space for the creation of hidden narratives in the rhythms of daily life.</p>",
      "gamma": true
     },
     {
      "title": "Project Development + Exhibition Setup",
      "html": "<h4>Initial Ideation</h4><p>The first thing we did was sketches and a concept for a sensory \"tent\" designed as a refuge within the gallery. Initially, we wanted to create a structure with PVC pipes and rather opaque fabrics, with the sensor under a cushion to invite people to sit in the center of the structure.</p><figure class=\"g\"><a href=\"media/works/cl/cl-sketches.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-sketches.jpg\" alt=\"Whiteboard sketches of the first sensory tent prototype\" loading=\"lazy\"></a></figure><p class=\"gcap\">Drafts from the first team meetings where first prototype was sketched</p><h4>Initial Ideation</h4><p>Sensor input is read by the Circuit Playground, programmed via the Arduino IDE, and sent to TouchDesigner. TouchDesigner processes the data, drives visuals, and sends OSC messages to Max/MSP. Max/MSP generates sound and interaction, while OSC feedback can return to TouchDesigner for synchronized audiovisual control.</p><figure class=\"g\"><a href=\"media/works/cl/cl-system-flow.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-system-flow.jpg\" alt=\"System map: Arduino, TouchDesigner, Max/MSP, sound and video\" loading=\"lazy\"></a></figure><p>We exhibited  the installation twice. The first time, at the CyberArts Gallery in Boston, we adapted the concept to a corner space that was shaped by the presence of a large, pre-installed TV screen. This constraint required us to reconfigure both the spatial layout and the projection design.</p><p>The second presentation took place at The Blanc in New York, where we were assigned a much larger space. This allowed us to install a long metal bar wrapped with sensors and wiring, connected at one end to an Arduino board, enabling a more expansive and physically immersive interaction.</p><figure class=\"g\"><a href=\"media/works/cl/cl-cyberarts-tv.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-cyberarts-tv.jpg\" alt=\"Miaowen behind the large TV at CyberArts Gallery\" loading=\"lazy\"></a></figure><p class=\"gcap\">➡️: Miaowen at the CyberArts Gallery, standing behind the large TV, used as a reference point to determine whether there was enough space for a pedestal to support the computer running TouchDesigner and Max/MSP.</p><figure class=\"g\"><a href=\"media/works/cl/cl-blanc-wall.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-blanc-wall.jpg\" alt=\"Miaowen beside a wall at The Blanc, New York\" loading=\"lazy\"></a></figure><p class=\"gcap\">⬆️: Miaowen at The Blanc Gallery, NY, standing beside the wall to gauge the scale of the space.</p><h4>Construction</h4><p>A metal frame with train-like handles, wrapped in semi-translucent fabric to soften the space.</p><figure class=\"g\"><a href=\"media/works/cl/cl-construction.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-construction.jpg\" alt=\"Constructing the curtained space\" loading=\"lazy\"></a></figure><p class=\"gcap\">Mariana and Miaowen constructing the space</p><h4>Interaction</h4><p>Integration of sensors in the handlebars, connected to a Circuit Playground board, to trigger dynamic projections and sound.</p><figure class=\"g\"><a href=\"media/works/cl/cl-wiring.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-wiring.jpg\" alt=\"Connecting the sensor wires to the board\" loading=\"lazy\"></a></figure><p class=\"gcap\">Miaowen connecting the wires to the board.</p><h4>Audiovisual</h4><p>Projections of passengers at train stations transformed into abstract visuals, alongside videos of hybrid train–nature landscapes, and a soundscape built from field recordings and ambient compositions using custom synthesizers in Max/MSP.</p><figure class=\"g\"><a href=\"media/works/cl/cl-salome-adjusting.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-salome-adjusting.jpg\" alt=\"Salome at the laptop adjusting the signal flow\" loading=\"lazy\"></a></figure><p class=\"gcap\">Salome adjusting the Max/MSP and TouchDesigner signal flow.</p>",
      "gamma": true
     },
     {
      "title": "Visual Elements",
      "html": "<figure class=\"g\"><video src=\"media/works/cl/cl-td-channel-loop.mp4\" autoplay muted loop playsinline aria-label=\"TouchDesigner output: particles flowing over a scanned train\"></video></figure><h4>1st Channel — TouchDesigner</h4><p>A 3D scan of part of a train forms the visual base of the scene. Images of people moving through train stations are transformed into flowing particles, creating a soft, abstract representation of passengers in motion. When visitors interact with the handles, sensors trigger changes in these particles and in the colors of the train, allowing the environment to gently shift in response. This turns an ordinary train setting into a living, responsive visual landscape that reflects presence, movement, and human connection.</p><div class=\"vid\"><iframe src=\"https://player.vimeo.com/video/1246123499?dnt=1&title=0&byline=0&portrait=0&color=ffd27a\" allow=\"autoplay; fullscreen; picture-in-picture\" allowfullscreen loading=\"lazy\" title=\"Connecting Lines – 1st Channel (TouchDesigner)\"></iframe></div><figure class=\"g\"><a href=\"media/works/cl/cl-channel2.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-channel2.jpg\" alt=\"TouchDesigner visual: a 3D scan of a train with flowing particles\" loading=\"lazy\"></a></figure><p>2ed Channel — Projected Video</p><p>The second video consists of a projection of hybrid train–nature landscapes. It reimagines the subway journey as a dreamlike environment, blending elements of transit and nature into a single, flowing scene. Through its shifting colors and soft imagery, the video casts a surreal, atmospheric glow across the entire installation.</p><figure class=\"g\"><a href=\"media/works/cl/cl-installation.jpg\" target=\"_blank\" rel=\"noopener\"><img src=\"media/works/cl/cl-installation.jpg\" alt=\"A visitor silhouetted against the projected hybrid train and nature landscape\" loading=\"lazy\"></a></figure>",
      "gamma": true
     },
     {
      "title": "A Site-Specific Work",
      "html": "<div class=\"geb\">Conclusion</div><p>Connecting Lines established itself as a profoundly site-specific work: it doesn't exist as an autonomous object, but must be conceived, adapted, and assembled in direct dialogue with the place where it is presented. Unlike a painting or sculpture, which can be moved without altering their essence, this installation only acquires full meaning in a specific setting, when all its components—metal structure, fabrics, sound, projections, and interaction—are configured in a specific environment. This condition turns the piece into a metaphor for our own relationship with spatiality: just as the work depends on physical space to exist, we also depend on the places we inhabit to define our experiences, identities, and connections.</p><p>The experience of Connecting Lines teaches us that even modest interventions can reconfigure the perception of transit spaces, inviting pauses of calm and introspection amidst urban routine.</p><p>The fact that the installation transformed from the initial idea of a \"sensory tent\" to an adaptation in the corner of the gallery demonstrates that the design process was also a process of negotiation with reality, with the technical and architectural conditions of the site. This capacity for adaptation reaffirms the notion that spaces are not mere containers, but active agents that shape our perception.</p><p>Its ephemeral nature—a work that only exists while all its pieces are assembled and active—reinforces the idea that both art and urban life are constituted by the collective and the situational, rather than the permanent or isolated.</p><p>In this sense, the installation not only explores how sensorial design can humanize public transportation, but also reminds us of our dependence on the physical: on the materials, environments, and specific conditions in which we move. Thus, Connecting Lines is not only an exercise in interactive design, but also an embodied reflection on how space and body intertwine to shape our life experience.</p>",
      "gamma": true
     },

     {
      "title": "Sound system: technical documentation",
      "html": "<p>The following documents the sound system Salome designed and built in Max/MSP: how touch becomes sound, how the patch works, and what changed between the Boston and New York versions.</p>",
      "divider": true
     },
     {
      "title": "Sound design intent",
      "html": "<p>CyberArts Gallery sits right beside the train line: every time a train passes, its noise fills the room. Train stations are usually experienced as hurried, crowded and stressful, so the starting question was whether that same sound world could be turned into a place of rest. The aim was to reimagine the MBTA train as a restorative space, an idea the team framed as <i>urban restorative design</i>.</p>\n<p>The sound design follows from that aim:</p>\n<ul>\n<li><b>Calm but unresolved.</b> C Mixolydian keeps the harmony bright and gentle, while its flattened seventh avoids the strong pull home of a major key. The music stays open, like a journey still under way.</li>\n<li><b>Train rhythm.</b> The six voices pulse at overlapping rates, like wheels and rail joints moving at different speeds, falling in and out of alignment.</li>\n<li><b>Breathing timescale.</b> The slowest cycle and each chord last 8 seconds, close to the length of a slow breath, so the music sets a calm pace instead of reacting with sudden changes.</li>\n</ul>"
     },
     {
      "title": "How it works",
      "html": "<p>Visitors step behind a semi-translucent curtain into a space framed like a train car, surrounded by projection screens and a stereo pair of speakers. Holding a train handle changes the projections and the sound. Each handle is a capacitive touch sensor, so the gesture needs no instructions: people reach for the handles out of habit.</p>\n<div class=\"flow\" role=\"img\" aria-label=\"Signal flow: train handles to Circuit Playground to TouchDesigner to Max/MSP to speakers\">\n <div class=\"n\"><b>Train handles</b>4 capacitive touch pads</div><div class=\"a\">→</div>\n <div class=\"n\"><b>Circuit Playground</b>Arduino; reads all 4 pads every 100 ms, sends them over serial at 9600 baud</div><div class=\"a\">→</div>\n <div class=\"n\"><b>TouchDesigner</b>processes the data, drives the visuals and sends OSC to Max; OSC can return for synchronized audiovisual control</div><div class=\"a\">→</div>\n <div class=\"n me\"><b>Max/MSP</b>custom synthesizer; OSC on UDP port 8000, values scaled from 1–200 and smoothed</div><div class=\"a\">→</div>\n <div class=\"n\"><b>Speakers</b>stereo pair inside the curtain</div>\n</div>\n<h4>What each handle controls</h4>\n<table class=\"map\"><tr><th>Handle</th><th>Controls</th><th>What you hear</th></tr>\n<tr><td>T1</td><td>Harmony reset</td><td>A touch fires a reset that re-syncs the harmony: all melody voices restart together, then drift apart again.</td></tr>\n<tr><td>T2</td><td>Drum</td><td>Sets the speed of the drum loop and the intensity of its phaser. No touch, no drum; a firmer hold drives the rhythm faster.</td></tr>\n<tr><td>T3</td><td>Foley wheel, X</td><td rowspan=\"2\">Together, T3 and T4 move a cursor across a wheel of four field recordings (waterside, lake, birds, wind), crossfading between them.</td></tr>\n<tr><td>T4</td><td>Foley wheel, Y</td></tr>\n</table>\n<h4>Sound layers</h4>\n<ul>\n<li><b>Ambient melody</b>: a slowly shifting harmonic cloud, articulated by touch.</li>\n<li><b>Drum</b>: the train's mechanical pulse, softened into a filtered, phasing rhythm.</li>\n<li><b>Field recordings</b>: recorded by Salome, including water and other sounds gathered on a trip to the Berkshires, blended so the train and the landscape blur together.</li>\n</ul>"
     },
     {
      "title": "Inside the Max/MSP patch",
      "html": "<figure class=\"svgfig\"><svg class=\"fig\" viewBox=\"0 0 740 395\" role=\"img\" aria-label=\"Patch architecture: OSC inputs T1 to T4 drive the ambient melody, drum and field-recording wheel, which mix to a stereo master\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block\"><rect x=\"10\" y=\"14\" width=\"180\" height=\"62\" rx=\"9\" fill=\"rgba(255,255,255,.62)\" stroke=\"rgba(0,0,0,.5)\" stroke-width=\"1\"/><text x=\"20.0\" y=\"31.0\" text-anchor=\"start\" fill=\"#222\" font-size=\"11.5\" font-weight=\"600\" >OSC in · UDP 8000</text><text x=\"20.0\" y=\"47.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"10.5\" >from TouchDesigner</text><text x=\"20.0\" y=\"61.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"10.5\" >scaled 1–200 → range</text><rect x=\"10\" y=\"110\" width=\"180\" height=\"44\" rx=\"9\" fill=\"rgba(255,236,190,.75)\" stroke=\"#a8650f\" stroke-width=\"1\"/><text x=\"20.0\" y=\"127.0\" text-anchor=\"start\" fill=\"#222\" font-size=\"11.5\" font-weight=\"600\" >T1</text><text x=\"20.0\" y=\"143.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"10.5\" >reset · bang</text><rect x=\"10\" y=\"210\" width=\"180\" height=\"44\" rx=\"9\" fill=\"rgba(255,236,190,.75)\" stroke=\"#a8650f\" stroke-width=\"1\"/><text x=\"20.0\" y=\"227.0\" text-anchor=\"start\" fill=\"#222\" font-size=\"11.5\" font-weight=\"600\" >T2</text><text x=\"20.0\" y=\"243.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"10.5\" >0–10 · smoothed 0.98</text><rect x=\"10\" y=\"340\" width=\"180\" height=\"44\" rx=\"9\" fill=\"rgba(255,236,190,.75)\" stroke=\"#a8650f\" stroke-width=\"1\"/><text x=\"20.0\" y=\"357.0\" text-anchor=\"start\" fill=\"#222\" font-size=\"11.5\" font-weight=\"600\" >T3 / T4</text><text x=\"20.0\" y=\"373.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"10.5\" >X / Y · smoothed</text><rect x=\"260\" y=\"90\" width=\"250\" height=\"96\" rx=\"9\" fill=\"rgba(255,255,255,.62)\" stroke=\"rgba(0,0 ne x1=\"384.0\" y1=\"116\" x2=\"447.0\" y2=\"116\" stroke=\"#3f72a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".45\"/><g><title>voice 4: E3 (MIDI 52)</title><circle cx=\"384.0\" cy=\"116\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"384.0\" y=\"107.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >E</text><g><title>voice 4: F3 (MIDI 53)</title><circle cx=\"394.5\" cy=\"116\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"394.5\" y=\"107.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >F</text><g><title>voice 4: G3 (MIDI 55)</title><circle cx=\"415.5\" cy=\"116\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"415.5\" y=\"107.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >G</text><g><title>voice 4: A3 (MIDI 57)</title><circle cx=\"436.5\" cy=\"116\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"436.5\" y=\"107.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >A</text><g><title>voice 4: B♭3 (MIDI 58)</title><circle cx=\"447.0\" cy=\"116\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"447.0\" y=\"107.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >B♭</text><text x=\"82.0\" y=\"150.0\" text-anchor=\"end\" fill=\"#5c5c5c\" font-size=\"10.5\" >voice 5</text><line x1=\"468.0\" y1=\"146\" x2=\"489.0\" y2=\"146\" stroke=\"#3f72a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".45\"/><g><title>voice 5: C4 (MIDI 60)</title><circle cx=\"468.0\" cy=\"146\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"468.0\" y=\"137.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >C</text><g><title>voice 5: D4 (MIDI 62)</title><circle cx=\"489.0\" cy=\"146\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"489.0\" y=\"137.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >D</text><text x=\"82.0\" y=\"180.0\" text-anchor=\"end\" fill=\"#5c5c5c\" font-size=\"10.5\" >voice 6</text><line x1=\"594.0\" y1=\"176\" x2=\"636.0\" y2=\"176\" stroke=\"#3f72a8\" stroke-width=\"2\" stroke-linecap=\"round\" opacity=\".45\"/><g><title>voice 6: C5 (MIDI 72)</title><circle cx=\"594.0\" cy=\"176\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"594.0\" y=\"167.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >C</text><g><title>voice 6: D5 (MIDI 74)</title><circle cx=\"615.0\" cy=\"176\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"615.0\" y=\"167.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >D</text><g><title>voice 6: E5 (MIDI 76)</title><circle cx=\"636.0\" cy=\"176\" r=\"5\" fill=\"#3f72a8\" stroke=\"#e4e4e4\" stroke-width=\"2\"/></g><text x=\"636.0\" y=\"167.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"9\" >E</text><text x=\"90.0\" y=\"232.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"10\" >Possible notes per voice. Random choices are quantised to C Mixolydian (C D E F G A B♭);</text><text x=\"90.0\" y=\"246.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"10\" >together the six voices span five octaves.</text></svg><figcaption>Possible notes for each voice.</figcaption></figure>\n<p>All 96 channels then pass through a second gen~ stage: a resonant filter bank tuned to the bass note (its harmonics ×1 to ×8, randomly modulated), dispersion delays whose lengths follow two hand-drawn envelope curves, and a 750 ms feedback delay with tanh saturation in the loop. This is what turns the grains into a continuous, breathing texture.</p>\n<h4>2 · Drum</h4>\n<p>A recorded kick loop plays through <code>groove~</code>, and its playback speed comes directly from T2 (0 to 10 after scaling). With no hand on the handle the loop stands still; holding it brings the pulse in and speeds it up. The loop then runs through six chained phaser stages: each inverts the phase of a delayed copy and adds it back, filtered by a state-variable filter swept by a 10 Hz LFO. T2 also sets the phaser depth, feedback and resonance, so pressure changes both tempo and timbre.</p>\n<h4>3 · Field-recording wheel</h4><figure class=\"svgfig\"><svg class=\"fig\" viewBox=\"0 0 740 300\" role=\"img\" aria-label=\"Field-recording wheel: four overlapping zones, Waterside, Lake, Bird and Wind, crossfaded by the X and Y position from handles T3 and T4\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block\"><defs><clipPath id=\"wc\"><rect x=\"40\" y=\"25\" width=\"250\" height=\"250\" rx=\"6\"/></clipPath></defs><rect x=\"40\" y=\"25\" width=\"250\" height=\"250\" rx=\"6\" fill=\"rgba(255,255,255,.45)\" stroke=\"rgba(0,0,0,.45)\"/><g clip-path=\"url(#wc)\"><g><title>Zone 1: Waterside</title><circle cx=\"100.0\" cy=\"82.5\" r=\"56.1\" fill=\"#a8650f\" fill-opacity=\".14\" stroke=\"#a8650f\" stroke-width=\"1.5\"/></g><g><title>Zone 2: Lake</title><circle cx=\"237.2\" cy=\"79.0\" r=\"71.4\" fill=\"#3f72a8\" fill-opacity=\".14\" stroke=\"#3f72a8\" stroke-width=\"1.5\"/></g><g><title>Zone 3: Bird</title><circle cx=\"90.0\" cy=\"216.2\" r=\"82.4\" fill=\"#3f72a8\" fill-opacity=\".14\" stroke=\"#3f72a8\" stroke-width=\"1.5\"/></g><g><title>Zone 4: Wind</title><circle cx=\"229.2\" cy=\"226.8\" r=\"76.0\" fill=\"#3f72a8\" fill-opacity=\".14\" stroke=\"#3f72a8\" stroke-width=\"1.5\"/></g></g><text x=\"100.0\" y=\"86.5\" text-anchor=\"middle\" fill=\"#222\" font-size=\"11\" font-weight=\"600\" >1 · Waterside</text><text x=\"237.2\" y=\"83.0\" text-anchor=\"middle\" fill=\"#222\" font-size=\"11\" font-weight=\"600\" >2 · Lake</text><text x=\"90.0\" y=\"220.2\" text-anchor=\"middle\" fill=\"#222\" font-size=\"11\" font-weight=\"600\" >3 · Bird</text><text x=\"229.2\" y=\"230.8\" text-anchor=\"middle\" fill=\"#222\" font-size=\"11\" font-weight=\"600\" >4 · Wind</text><circle cx=\"170.0\" cy=\"142.5\" r=\"5\" fill=\"#222\"/><circle cx=\"170.0\" cy=\"142.5\" r=\"9\" fill=\"none\" stroke=\"#222\"/><text x=\"165.0\" y=\"293.0\" text-anchor=\"middle\" fill=\"#5c5c5c\" font-size=\"10.5\" >X  ←  T3</text><text x=\"28.0\" y=\"150.0\" text-anchor=\"middle\" fill=\"#5c5c5c\" font-size=\"10.5\" transform=\"rotate(-90 28 150.0)\">Y  ←  T4</text><text x=\"330.0\" y=\"45.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" >The cursor's position sets how loud each</text><text x=\"330.0\" y=\"61.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" >recording is: the closer it is to a zone's</text><text x=\"330.0\" y=\"77.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" >centre, the more of that recording you hear.</text><text x=\"330.0\" y=\"93.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" >Overlapping zones blend into each other.</text><text x=\"330.0\" y=\"109.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" ></text><text x=\"330.0\" y=\"125.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" >Each recording loops a 12-second section</text><text x=\"330.0\" y=\"141.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" >with 300 ms crossfades, so it never clicks.</text><text x=\"330.0\" y=\"157.0\" text-anchor=\"start\" fill=\"#5c5c5c\" font-size=\"11\" ></text><text x=\"330.0\" y=\"173.0\" text-anchor=\"start\" fill=\"#a8650f\" font-size=\"11\" >Moving into zone 1 (Waterside) also plays</text><text x=\"330.0\" y=\"189.0\" text-anchor=\"start\" fill=\"#a8650f\" font-size=\"11\" >a recording of a passing train.</text></svg><figcaption>The four zones and their positions, as laid out in the patch.</figcaption></figure>\n<p>Four field recordings sit on a <code>nodes</code> object. The cursor position, from T3 (X) and T4 (Y), sets each recording's level according to how far the cursor is inside that zone. Each recording plays through a crossfade abstraction that loops a 12-second section with 300 ms fades and a 0.4 fade curve. When the cursor enters zone 1, a change detector fires a one-shot recording of a passing train.</p><figure><img src=\"media/works/P06_connecting-lines__field-recording-berkshires.jpg\" alt=\"Salome crouched at the water's edge recording, a lake and autumn forest beyond\" loading=\"lazy\"><figcaption>Recording water sounds for Connecting Lines in the Berkshires, October 2025.</figcaption></figure>\n<h4>4 · From sensor to sound: scaling and smoothing</h4>\n<p>Raw capacitive readings arrive as values from 1 to 200. Max rescales them to each control's range (0 to 10 for the drum, 0 to 1 for the wheel), discards repeated values with <code>change</code>, and passes them through a one-pole low-pass filter written as a small subpatch: <i>y = (1 − a)·x + a·y<sub>previous</sub></i>. The coefficient sets the feel. At a = 0.98 the drum and one wheel axis glide over many messages, so the sound swells rather than jumps; at a = 0.5 the other axis follows the hand almost immediately. Without this stage the sound changed so fast it never settled, which is noted in the patch itself: \"No resting mood, continuously bangs the signal\".</p><figure class=\"svgfig\"><svg class=\"fig\" viewBox=\"0 0 740 240\" role=\"img\" aria-label=\"Smoothing: response to a sudden full touch. With coefficient 0.5 the value arrives in about 5 messages; with 0.98 it takes about 149\" xmlns=\"http://www.w3.org/2000/svg\" style=\"width:100%;height:auto;display:block\"><line x1=\"60\" y1=\"190.0\" x2=\"700\" y2=\"190.0\" stroke=\"rgba(0,0,0,.16)\"/><text x=\"52.0\" y=\"194.0\" text-anchor=\"end\" fill=\"#5c5c5c\" font-size=\"10\" >0%</text><line x1=\"60\" y1=\"147.5\" x2=\"700\" y2=\"147.5\" stroke=\"rgba(0,0,0,.16)\"/><text x=\"52.0\" y=\"151.5\" text-anchor=\"end\" fill=\"#5c5c5c\" font-size=\"10\" >25%</text><line x1=\"60\" y1=\"105.0\" x2=\"700\" y2=\"105.0\" stroke=\"rgba(0,0,0,.16)\"/><text x=\"52.0\" y=\"109.0\" text-anchor=\"end\" fill=\"#5c5c5c\" font-size=\"10\" >50%</text><line x1=\"60\" y1=\"62.5\" x2=\"700\" y2=\"62.5\" stroke=\"rgba(0,0,0,.16)\"/> .1 565.6,27.0 568.8,26.8 572.0,26.7 575.2,26.6 578.4,26.4 581.6,26.3 584.8,26.2 588.0,26.1 591.2,25.9 594.4,25.8 597.6,25.7 600.8,25.6 604.0,25.5 607.2,25.4 610.4,25.3 613.6,25.2 616.8,25.1 620.0,25.0 623.2,24.9 626.4,24.8 629.6,24.7 632.8,24.6 636.0,24.5 639.2,24.4 642.4,24.3 645.6,24.2 648.8,24.1 652.0,24.0 655.2,24.0 658.4,23.9 661.6,23.8 664.8,23.7 668.0,23.7 671.2,23.6 674.4,23.5 677.6,23.4 680.8,23.4 684.0,23.3 687.2,23.2 690.4,23.2 693.6,23.1 696.8,23.1 700.0,23.0\"/><g><title>a=0.98: 10% after 5 messages</title><circle cx=\"76.0\" cy=\"173.7\" r=\"7\" fill=\"transparent\"/></g><g><title>a=0.98: 40% after 25 messages</title><circle cx=\"140.0\" cy=\"122.6\" r=\"7\" fill=\"transparent\"/></g><g><title>a=0.98: 64% after 50 messages</title><circle cx=\"220.0\" cy=\"81.9\" r=\"7\" fill=\"transparent\"/></g><g><title>a=0.98: 87% after 100 messages</title><circle cx=\"380.0\" cy=\"42.5\" r=\"7\" fill=\"transparent\"/></g><g><title>a=0.98: 95% after 149 messages</title><circle cx=\"536.8\" cy=\"28.4\" r=\"7\" fill=\"transparent\"/></g><text x=\"104.8\" y=\"47.2\" text-anchor=\"start\" fill=\"#a8650f\" font-size=\"10.5\" font-weight=\"600\" >X (a = 0.5): 95% in 5 messages</text><text x=\"284.0\" y=\"77.3\" text-anchor=\"start\" fill=\"#3f72a8\" font-size=\"10.5\" font-weight=\"600\" >T2 and Y (a = 0.98): 95% after 149 messages</text></svg><figcaption>How quickly each smoothed control reaches a new value after a sudden full touch.</figcaption></figure>\n<h4>5 · Output</h4>\n<p>The melody's 96 channels are mixed down to stereo with automatic gain, passed through a tanh soft clipper so that peaks round off instead of distorting harshly, and summed with the drum, the four recordings and the train at the output.</p>"
     },
     {
      "title": "From Boston to New York",
      "html": "<p>The piece was first shown at CyberArts Gallery, inside a Boston train station, in spring 2025, then rebuilt for THE BLANC in New York (opening November 8, 2025). New York offered a much larger space: instead of individual handles in a gallery corner, a long metal bar wrapped with sensors and wiring ran through the installation, surrounded by three projection screens. The sound system was reworked to match:</p>\n<ul>\n<li><b>Simpler OSC addressing.</b> Messages moved from named addresses (<code>/T1 /T2 /movX /movY</code>) to numbered channels, with each sensor's raw 1–200 range scaled directly to the control it drives.</li>\n<li><b>Ready on load.</b> Every control now initializes when the patch opens, so the room sounds right from the first moment, before anyone touches a handle.</li>\n<li><b>Tuned smoothing.</b> Each control got its own smoothing coefficient (see section 4 above), so the drum swells while the wheel can still follow the hand.</li>\n<li><b>Self-recovering sensors.</b> The Arduino sketch gained a 60-second reset marker, so the system can recalibrate after the capacitive pads drift.</li>\n</ul>"
     },
     {
      "title": "Problems and fixes",
      "html": "<ul>\n<li><b>A grounded sensor bar.</b> In New York the sensor wiring ran along the metal bar, and the bar touched the floor. The capacitive readings were disrupted, and extensive troubleshooting traced the problem to that contact. Insulating it with electrical tape, found the night before the opening, made the readings usable again.</li>\n<li><b>Sensor drift.</b> The capacitive pads sometimes stopped responding during long gallery days. The New York version addresses this with a periodic reset in the Arduino sketch and with smoothing on the Max side.</li>\n<li><b>One computer, two heavy programs.</b> TouchDesigner and Max/MSP competed for resources on the same machine, and the sensor data had to pass through both. The final chain runs in one direction (Arduino to TouchDesigner to Max/MSP to the speakers), with Max receiving the values as OSC on a single port.</li>\n<li><b>Change you can hear.</b> Early tests were too subtle, so the melody and drum layers were reworked to respond more audibly when a handle is held.</li>\n</ul>"
     },
     {
      "title": "Reflection and next steps",
      "html": "<p>Building Connecting Lines meant building a small piece of architecture, a space that resembles a train car, and every physical decision affected the sound. The most valuable lesson was that in an interactive installation, the electronics, the materials and the room are part of the instrument, and they need as much testing as the patch.</p>\n<p><b>Next:</b> a version in which the sound adapts to each visitor, responding to how long and how they hold the handles, rather than mapping touch to the same response for everyone. Building that system in Wwise rather than Max/MSP could also make it more stable for long-running exhibitions.</p>"
     },
     {
      "title": "The Max/MSP patch",
      "html": "<figure><a href=\"media/works/P06_connecting-lines__max-patch-full.jpg\" target=\"_blank\" rel=\"noopener\" title=\"Open full size\"><img src=\"media/works/P06_connecting-lines__max-patch.jpg\" alt=\"Max/MSP patch: ambient melody, drum, field-recording wheel and OSC receiver\" loading=\"lazy\"></a><figcaption>Max/MSP patch (New York version): ambient melody (left), drum (top right), field-recording wheel (bottom), OSC receiver (right). Click to enlarge.</figcaption></figure>"
     }

  function slug(t) { return String(t).toLowerCase().replace(/[’']/g, '').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''); }
  function rows(list) {
    /* newest first: by end year ('present' = now), then start year; undated last */
    function yrs(y) {
      var m = String(y || '').match(/\d{4}/g) || [];
      var end = /present/i.test(y) ? 9999 : (m.length ? +m[m.length - 1] : -1);
      return [end, m.length ? +m[0] : -1];
    }
    list = list.map(function (r, k) { return [r, k]; }).sort(function (a, b) {
      var A = yrs(a[0][2]), B = yrs(b[0][2]);
