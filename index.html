<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salome Yichi Zhang · Creative Technologist, Researcher, Composer</title>
<meta name="description" content="Salome Yichi Zhang: creative technologist, researcher and composer working across kinetic sound sculpture, generative sound, music cognition and film.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bri:.57; --sat:1.4; --con:1.14; --icon:.55;
  --rx:16px; --ry:60vh;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --sys:-apple-system, BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
  --glass:linear-gradient(to bottom, rgba(255,255,255,.22), rgba(255,255,255,.06) 50%, rgba(255,255,255,.02) 51%, rgba(255,255,255,.08));
  --glass-edge:rgba(255,255,255,.25);
  --glow:linear-gradient(to bottom, rgba(255,226,150,.30), rgba(255,206,110,.12) 50%, rgba(255,196,90,.08) 51%, rgba(255,214,120,.16));
  --glow-edge:rgba(255,222,150,.55);
  --dark:linear-gradient(to bottom, rgba(110,110,110,.86), rgba(45,45,45,.86) 50%, rgba(20,20,20,.86) 51%, rgba(38,38,38,.86));
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:var(--mono);font-size:13px;overflow:hidden}
button{font:inherit;color:inherit}
a{color:inherit}

/* backdrop */
#bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none;
  filter:brightness(var(--bri)) saturate(var(--sat)) contrast(var(--con));background:#000}

/* shared glass */
.glass{background:var(--glass);border:1px solid var(--glass-edge);border-radius:10px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);
  transition:background .25s, border-color .25s, box-shadow .25s, color .25s}
.glowable:hover,.glowable:focus-visible,.icon:hover .label,.icon:focus-visible .label{
  background:var(--glow);border-color:var(--glow-edge);color:#fff6dc;outline:none;
  box-shadow:inset 0 1px 0 rgba(255,244,210,.55), 0 0 18px rgba(255,200,90,.32)}

/* banner */
.banner{position:fixed;left:16px;right:16px;top:14px;height:30px;z-index:20;overflow:hidden;cursor:default;
  display:flex;align-items:center;user-select:none}
.banner .track{display:flex;white-space:nowrap;animation:scroll 60s linear infinite;will-change:transform}
.banner .track span{padding-right:0;font-size:14px;letter-spacing:.02em}
@keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* desktop */
.icons{position:fixed;right:16px;top:62px;bottom:16px;width:132px;z-index:5;display:flex;flex-direction:column;
  align-items:center;gap:14px;overflow-y:auto;transition:opacity .25s}
.icon{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;background:none;border:0;padding:0;
  cursor:pointer;text-decoration:none}
.icon img{width:96px;height:72px;object-fit:contain;transition:transform .2s;
  filter:contrast(calc(1 - var(--icon) * .6)) brightness(calc(1 + var(--icon) * .35))}
.icon:hover img{transform:translateY(-2px)}
.icon .label{width:100%;padding:3px 0;text-align:center;font-size:13px}

/* windows */
.win{position:fixed;z-index:10;border:1px solid #000;border-radius:8px;overflow:hidden;
  background:rgba(255,255,255,.84);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);
  box-shadow:0 12px 34px rgba(0,0,0,.7);color:#111;text-shadow:none}
.win .bar{position:relative;height:26px;display:flex;align-items:center;justify-content:center;
  background:var(--dark);border-bottom:1px solid #000;box-shadow:inset 0 1px 0 rgba(255,255,255,.35);
  color:#fff;text-shadow:0 1px 1px #000;font-size:12px;letter-spacing:.04em;user-select:none}
.win .dot,.win .x{position:absolute;left:9px;top:6px;width:13px;height:13px;border-radius:50%;border:1px solid #000;
  background:radial-gradient(circle at 35% 30%, #fff, #bdbdbd 45%, #3a3a3a);padding:0;cursor:pointer}
.win .x:hover{background:radial-gradient(circle at 35% 30%, #fff8e0, #f0c66a 45%, #6b4a10)}
.win .body{padding:14px 16px;overflow:auto}

#readme{left:var(--rx);top:var(--ry);width:min(600px, calc(100vw - 200px));transition:opacity .25s}
#readme .bar{cursor:grab}
#readme.dragging .bar{cursor:grabbing}
#readme .body{font-size:13.5px;line-height:1.55}
#readme p{margin:0 0 1em}#readme p:last-child{margin:0}

#panel{left:50%;top:50%;transform:translate(-50%,-50%) scale(.97);opacity:0;pointer-events:none;
  width:min(600px, 92vw);max-height:80vh;display:flex;flex-direction:column;transition:opacity .2s, transform .2s}
#panel.wide{width:min(860px, 94vw)}
#panel.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%) scale(1)}
#panel .body{font-size:12px;line-height:1.45}
body.has-window #readme,body.has-window .icons{opacity:0;pointer-events:none}

.rows{border-top:1px solid rgba(0,0,0,.75)}
.row{display:grid;grid-template-columns:6fr 2fr 4fr;gap:8px;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.75)}
.row .y{text-align:center}.row .r{text-align:right}
.row .m{opacity:.65}
.sub{margin:18px 0 6px;font-weight:500;letter-spacing:.06em}
/* clickable work titles in folder lists */
.row a.wl{color:inherit;text-decoration:none;border-bottom:1px dotted rgba(0,0,0,.45)}
.row a.wl:hover{background:rgba(255,206,110,.35);box-shadow:0 0 0 3px rgba(255,206,110,.35);border-radius:3px;border-bottom-color:transparent}
/* work page (third layer) */
.work h2{margin:2px 0 4px;font-size:20px;letter-spacing:.01em}
.work .meta{margin:0 0 14px;opacity:.7}
.work .vid{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden;margin:4px 0 16px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.6)}
.work .vid iframe,.work .vid video{position:absolute;inset:0;width:100%;height:100%;border:0;background:#000;object-fit:contain}
.work figure.side img{max-height:46vh}
.work figure{margin:4px 0 16px;text-align:center}
.work figure img{max-width:100%;max-height:62vh;border-radius:8px;box-shadow:0 1px 0 rgba(255,255,255,.6),0 6px 18px rgba(0,0,0,.25)}
.work figure figcaption{font-size:11.5px;opacity:.6;margin-top:6px}
.work .facts{margin:14px 0;padding:10px 0;border-top:1px solid rgba(0,0,0,.75);border-bottom:1px solid rgba(0,0,0,.75);
  display:grid;grid-template-columns:7em 1fr;gap:6px 12px;font-size:12.5px}
.work .facts dt{opacity:.6}.work .facts dd{margin:0}
.work .tags{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.work .tags span{font-size:11px;padding:2px 9px;border-radius:999px;border:1px solid rgba(0,0,0,.35);background:rgba(255,255,255,.35)}
.work .wa{margin:16px 0 6px}
.work .wa .track-row{grid-template-columns:minmax(0,1fr) minmax(190px,15em)}
.work .wd{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px}
.work .wd .lr-link{margin:0}
.work .soon{opacity:.55;font-style:italic;margin:12px 0}
.lr-link{display:inline-block;margin:2px 0 14px;padding:4px 12px;border-radius:999px;text-decoration:none;
  border:1px solid rgba(0,0,0,.6);background:rgba(0,0,0,.06)}
.lr-link:hover{background:rgba(255,206,110,.35);border-color:rgba(160,110,20,.7)}
.track-row{display:grid;grid-template-columns:2.2em minmax(0,1fr) minmax(190px,15em) minmax(9em,1.25fr);gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid rgba(0,0,0,.75)}
.play{border:1px solid rgba(0,0,0,.6);border-radius:999px;background:rgba(0,0,0,.06);padding:3px 10px;cursor:pointer;font-size:11px}
.play:hover{background:rgba(255,206,110,.35)}
.play[disabled]{opacity:.35;cursor:default}
.pl{display:flex;align-items:center;gap:8px;height:28px;padding:0 10px 0 3px;border-radius:999px;
  border:1px solid rgba(0,0,0,.45);background:linear-gradient(rgba(255,255,255,.55),rgba(0,0,0,.05));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.pl.on{border-color:rgba(160,110,20,.7);background:linear-gradient(rgba(255,236,190,.55),rgba(255,206,110,.18))}
.pl .pb{flex:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(0,0,0,.55);cursor:pointer;padding:0;
  background:radial-gradient(circle at 50% 30%,#4a4a4a,#0d0d0d 70%);color:#eee;font-size:9px;line-height:20px;text-align:center}
.pl .pb:hover{box-shadow:0 0 8px 2px var(--glow,rgba(255,214,120,.55))}
.pl .bar{flex:1;height:6px;border-radius:3px;background:rgba(0,0,0,.18);position:relative;cursor:pointer;touch-action:none}
.pl .bar i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:linear-gradient(#5a5a5a,#111)}
.pl .bar::after{content:'';position:absolute;inset:-8px 0}
.pl .t{flex:none;font-size:11px;font-variant-numeric:tabular-nums;opacity:.8;min-width:5.6em;text-align:right}
.pl.bad{opacity:.4}
.track-row > div:last-child{font-size:11.5px;line-height:1.35;opacity:.85}
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:18px}
.about img{width:100%;border-radius:4px;display:block}
.about.nophoto{grid-template-columns:1fr}
.about h2{font-size:15px;margin:0 0 2px}
.about .roles{font-style:italic;margin:0 0 12px}
.about p{margin:0 0 10px}
.sec{margin-top:16px;padding-top:12px;border-top:1px solid rgba(0,0,0,.75)}
.sec h3{font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px}
.ent{display:grid;grid-template-columns:7em 1fr;gap:10px;margin-bottom:10px}
.ent ul{margin:4px 0 0;padding-left:1.1em}
.cvlink{display:inline-block;margin-top:16px}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.contact .k{opacity:.6;margin-bottom:4px}

/* bottom controls */
.controls{position:fixed;left:16px;bottom:16px;z-index:30;display:flex;gap:8px}
.controls button{padding:5px 12px;font-size:11px;letter-spacing:.12em;cursor:pointer}
#codepanel{position:fixed;left:16px;bottom:56px;z-index:30;display:none;width:min(560px, calc(100vw - 32px));
  max-height:min(62vh,560px);overflow:auto;margin:0;padding:12px 14px;font-size:10.5px;line-height:1.5;color:#111;
  white-space:pre;border-radius:8px}
#codepanel .c{color:#8a8a8a}

/* enter screen */
#enter{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:18px;letter-spacing:.08em;transition:opacity .7s}
#enter .go{padding:10px 30px;font-size:13px;letter-spacing:.25em;cursor:pointer}
#enter .sub{opacity:.6;letter-spacing:.04em;margin:0;font-weight:400}
#enter .skip{background:none;border:0;opacity:.5;text-decoration:underline;cursor:pointer;font-size:12px}
#enter .note{opacity:.6;min-height:1em;font-size:12px}

/* tuning panel */
#tune{position:fixed;right:16px;bottom:16px;z-index:40;width:270px;padding:10px 12px;border-radius:8px;
  background:#fff;color:#000;border:1px solid #000;box-shadow:0 10px 30px rgba(0,0,0,.6);font-size:11px;line-height:1.5;display:none}
#tune h4{margin:6px 0 4px;font-weight:500;letter-spacing:.14em;font-size:11px}
#tune label{display:flex;align-items:center;gap:8px;margin:3px 0}
#tune label span{width:90px}#tune input{flex:1}
#tune output{display:block;margin-top:8px;padding-top:6px;border-top:1px solid #000}

/* phones and small windows */
@media (max-width:600px){
  html,body{overflow:auto}
  .banner{position:sticky;top:0;left:0;right:0;margin:10px 10px 0}
  .icons{position:static;width:auto;flex-direction:row;flex-wrap:wrap;justify-content:center;padding:14px 10px;gap:10px;overflow:visible}
  .icon{width:96px}.icon img{width:72px;height:56px}
  #readme{position:relative;left:auto;top:auto;width:auto;margin:12px}
  #readme .bar{cursor:default}
  #panel{width:94vw;max-height:84vh}
  .row{grid-template-columns:1fr auto}.row .r{grid-column:1 / -1;text-align:left;opacity:.75}
  .about{grid-template-columns:1fr}
  .controls{position:fixed}
}
@media (prefers-reduced-motion:reduce){.banner .track{animation:none}}
</style>
</head>
<body>
<video id="bg" muted loop playsinline autoplay preload="auto"></video>

<header class="banner glass" id="banner" aria-label="Salome Yichi Zhang · Creative Technologist · Researcher · Composer">
  <div class="track" id="track"></div>
</header>

<section class="win" id="readme" aria-label="Artist statement">
  <div class="bar" id="readmeBar"><span class="dot" aria-hidden="true"></span>readme.txt</div>
  <div class="body" id="statement"></div>
</section>

<nav class="icons" id="icons" aria-label="Sections"></nav>

<section class="win" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
  <div class="bar"><button class="x" id="close" aria-label="Close"></button><span id="panelTitle"></span></div>
  <div class="body" id="panelBody"></div>
</section>

<div class="controls">
  <button class="glass glowable" id="snd" type="button">SOUND OFF</button>
  <button class="glass glowable" id="binBtn" type="button" title="Binaural 3D sound (HRTF). Best with headphones; switch off for speakers.">3D ON</button>
  <button class="glass glowable" id="codeBtn" type="button">CODE</button>
</div>
<pre class="win" id="codepanel"></pre>

<div id="enter">
  <button class="go glass glowable" id="go" type="button">ENTER</button>
  <p class="sub">Sound on. Best with headphones.</p>
  <button class="skip" id="skip" type="button">enter without sound</button>
  <div class="note" id="note"></div>
</div>

<div id="tune">
  <h4>BACKDROP</h4>
  <label><span>Brightness</span><input type="range" min="0" max="1" step=".01" data-k="bri"></label>
  <label><span>Colour</span><input type="range" min="0" max="1.5" step=".01" data-k="sat"></label>
  <label><span>Contrast</span><input type="range" min=".5" max="2" step=".01" data-k="con"></label>
  <h4>INTERFACE</h4>
  <label><span>Icon grey</span><input type="range" min="0" max="1" step=".01" data-k="icon"></label>
  <h4>STATEMENT</h4>
  <div>Drag the readme.txt bar to move it.</div>
  <output id="tuneOut"></output>
</div>

<script type="text/plain" id="csd"><CsoundSynthesizer>
<CsOptions>
-odac -d -m0
</CsOptions>
<CsInstruments>
sr = 48000
ksmps = 64
nchnls = 2
0dbfs = 1
seed 0

gaDryL init 0
gaDryR init 0
gaRevL init 0
gaRevR init 0

; ---------- binaural (HRTF) ----------
; Measured head-related transfer functions (Csound's data set for the running
; sample rate: 44.1, 48 or 96 kHz). Sources are placed around the listener's head;
; "bin" = 1 for binaural, 0 for plain stereo.
gSHL sprintf "hrtf-%d-left.dat", sr
gSHR sprintf "hrtf-%d-right.dat", sr

; ---------- binaural room ----------
; Four room buses, one per quarter around the listener (front-right, back-right,
; back-left, front-left). Each feeds an hrtfearly room model, so a sound's wall,
; floor and ceiling reflections arrive from its own side of the room. A shared
; hrtfreverb gives the binaural late tail.
gaQ1 init 0
gaQ2 init 0
gaQ3 init 0
gaQ4 init 0

opcode RoomSend, 0, akk
  asig, kaz, kamt xin
  k1 = cos((kaz - 45)*$M_PI/180)
  k2 = cos((kaz - 135)*$M_PI/180)
  k3 = cos((kaz - 225)*$M_PI/180)
  k4 = cos((kaz - 315)*$M_PI/180)
  k1 = (k1 < 0 ? 0 : k1)
  k2 = (k2 < 0 ? 0 : k2)
  k3 = (k3 < 0 ? 0 : k3)
  k4 = (k4 < 0 ? 0 : k4)
  gaQ1 = gaQ1 + asig*k1*kamt
  gaQ2 = gaQ2 + asig*k2*kamt
  gaQ3 = gaQ3 + asig*k3*kamt
  gaQ4 = gaQ4 + asig*k4*kamt
endop

; D major pentatonic, two octaves (semitones from root)
giScale ftgen 0, 0, -8, -2, 0, 2, 4, 7, 9, 12, 14, 16

; ---------- conductor: decides when drops and harmonic tides happen ----------
instr 1
  kTime timeinsts
  kNextDrop init 0.2
  kNextPad init 0
  kNextSh init 3
  kSlow oscili 0.5, 1/97
  kSlow = kSlow + 0.5
  if kTime >= kNextDrop then
    kdur random 1.4, 3.8
    event "i", 2, 0, kdur
    kc random 0, 1
    if kc > 0.86 then
      event "i", 2, 0.08, kdur*0.8
      event "i", 2, 0.19, kdur*0.6
    endif
    kgap random 0.25, 2.6
    kNextDrop = kTime + kgap*(1.7 - 1.25*kSlow)
  endif
  if kTime >= kNextPad then
    kpd random 42, 62
    kr1 random 0, 4.99
    kr2 random 0, 7.99
    kr3 random 0, 7.99
    kn1 table int(kr1), giScale
    kn2 table int(kr2), giScale
    kn3 table int(kr3), giScale
    event "i", 4, 0, kpd, 38 + kn1
    event "i", 4, 0.7, kpd, 50 + kn2
    event "i", 4, 1.6, kpd, 57 + kn3
    kgp random 24, 36
    kNextPad = kTime + kgp
  endif
  ; shimmer: a sparkling source that circles the head
  if kTime >= kNextSh then
    ksd random 14, 22
    event "i", 5, 0, ksd
    ksg random 25, 45
    kNextSh = kTime + ksg
  endif
endin

; ---------- droplet: bubble chirp + inharmonic porcelain partials ----------
instr 2
  irnd random 0, 7.99
  isemi table int(irnd), giScale
  ; pitch varies over three octaves (lower ones more likely), slightly detuned each time
  io random 0, 1
  ioct = (io < 0.4 ? 0 : (io < 0.8 ? 1 : 2))
  idet random -0.3, 0.3
  ifreq = cpsmidinn(62 + isemi + 12*ioct + idet)
  iamp random 0.04, 0.13
  ; stereo placement: 30% toward left or right, side chosen at random per drop
  iside random 0, 1
  ipan = (iside > 0.5 ? 0.65 : 0.35)
  ; binaural placement: anywhere around the head, a little above ear level,
  ; drifting downward as it rings, like a drop falling past you
  iaz random 0, 360
  iel random -5, 50
  kel line iel, p3, iel - 30
  ; each drop also travels 50-130 degrees around you while it rings
  itrav random 50, 130
  itd random 0, 1
  itrav = (itd > 0.5 ? itrav : -itrav)
  kaz line iaz, p3, iaz + itrav
  kaz wrap kaz, 0, 360
  ; distance: near drops are louder and dry, far drops quieter and wetter
  inear random 0, 1
  igain = 0.55 + 1.1*inear
  idry = 0.35 + 0.9*inear
  iwet = 0.95 - 0.7*inear
  kf expseg ifreq*0.62, 0.035, ifreq, p3-0.035, ifreq*1.015
  aenv expseg 0.0001, 0.004, 1, p3-0.004, 0.0001
  aen2 expseg 0.0001, 0.003, 1, p3*0.35, 0.0001, p3*0.65, 0.0001
  a1 poscil aenv, kf
  a2 poscil aen2*0.2, kf*2.756
  a3 poscil aen2*0.08, kf*5.404
  asig = (a1 + a2 + a3) * iamp
  kbin chnget "bin"
  kbin port kbin, 0.3
  ; high cut: soft (3.75 kHz) in stereo; opened up in 3D, because the
  ; ear's direction cues (above / behind / in front) live above 4 kHz
  kcut chnget "cut"
  kcut = (kcut < 200 ? 3750 : kcut)
  kcut = kcut + (11000 - kcut)*kbin
  asig butlp asig, kcut
  asig butlp asig, kcut
  ; a tiny bright tick at the start of each drop gives the ear an exact position
  atk expseg 1, 0.006, 0.0001, p3-0.006, 0.0001
  an noise 1, 0
  an buthp an, 2500
  asig = asig + an*atk*iamp*0.5*kbin
  aSL, aSR pan2 asig, ipan
  aBL, aBR hrtfmove2 asig*igain, kaz, kel, gSHL, gSHR, 4, 9, sr
  aL = aSL*(1-kbin) + aBL*kbin*1.4
  aR = aSR*(1-kbin) + aBR*kbin*1.4
  RoomSend asig*igain, kaz, (0.6 + 0.8*(1-inear))*kbin
  kdry = 0.3 + (idry - 0.3)*kbin
  kwet = 0.85 + (iwet - 0.85)*kbin
  gaDryL = gaDryL + aL*kdry
  gaDryR = gaDryR + aR*kdry
  gaRevL = gaRevL + aL*kwet
  gaRevR = gaRevR + aR*kwet
endin

; ---------- water: band-passed noise breathing like waves ----------
instr 3
  kw1 oscili 1, 1/11.3
  kw2 oscili 1, 1/17.9
  kw3 oscili 1, 1/61
  kamp = 0.55 + 0.25*kw1 + 0.2*kw2
  kamp port kamp, 0.4
  kcf = 380 + 700*kamp + 250*kw3
  aNL noise 0.5, 0.7
  aNR noise 0.5, 0.7
  aL butbp aNL, kcf, kcf*0.7
  aR butbp aNR, kcf*1.07, kcf*0.7
  aSh noise 0.04, 0
  aSh butbp aSh, 3200 + 800*kw2, 1500
  kgain = kamp*kamp*0.9
  aL = aL*kgain + aSh*kamp*0.3
  aR = aR*kgain + aSh*kamp*0.3
  ; slow wave-like drift between left and right (about 26 s per cycle)
  kwp oscili 0.36, 1/26
  kwpan = 0.5 + kwp
  aL = aL * sqrt(2*(1-kwpan))
  aR = aR * sqrt(2*kwpan)
  kbw chnget "bin"
  kbw port kbw, 0.3
  kwg = 1 - 0.4*kbw
  gaDryL = gaDryL + aL*0.55*kwg
  gaDryR = gaDryR + aR*0.55*kwg
  gaRevL = gaRevL + aL*0.35*kwg
  gaRevR = gaRevR + aR*0.35*kwg
endin

; ---------- tide: slow sine chord tones that swell and fade ----------
instr 4
  ifreq = cpsmidinn(p4)
  ; each chord tone drifts slowly from one side to the other over its life
  iside random 0, 1
  ioff random 0.28, 0.42
  ipanA = (iside > 0.5 ? 0.5 - ioff : 0.5 + ioff)
  ipanB = 1 - ipanA
  kpan line ipanA, p3, ipanB
  ; binaural: each tone travels 60-140 degrees around the head over its life
  iaz0 random 0, 360
  isweep random 150, 300
  idir random 0, 1
  isweep = (idir > 0.5 ? isweep : -isweep)
  kaz line iaz0, p3, iaz0 + isweep
  kaz wrap kaz, 0, 360
  iel random -10, 25
  iatt = p3*0.4
  aenv linseg 0, iatt, 1, p3-2*iatt, 1, iatt, 0
  irate random 0.05, 0.2
  kdrift oscili 0.0025, irate
  ktone oscili 0.5, 1/23
  a1 poscil 1, ifreq*(1+kdrift)
  a2 poscil 0.7, ifreq*1.004
  a3 poscil 0.25, ifreq*2.003
  a4 poscil 0.08, ifreq*3.01
  kbin chnget "bin"
  kbin port kbin, 0.3
  ; airy upper shimmer (only in 3D): gives the ear something above 2 kHz to track
  aair noise 1, 0
  aair butbp aair, ifreq*8, ifreq*1.5
  aair = aair * (0.5 + 0.5*ktone) * 0.35 * kbin
  asig = (a1 + a2 + (a3 + a4)*(0.6 + ktone) + aair) * aenv * 0.04
  aSL, aSR pan2 asig, kpan
  aBL, aBR hrtfmove2 asig, kaz, iel, gSHL, gSHR, 4, 9, sr
  RoomSend asig, kaz, 0.7*kbin
  aL = aSL*(1-kbin) + aBL*kbin*1.25
  aR = aSR*(1-kbin) + aBR*kbin*1.25
  gaDryL = gaDryL + aL*0.6
  gaDryR = gaDryR + aR*0.6
  gaRevL = gaRevL + aL*0.5
  gaRevR = gaRevR + aR*0.5
endin

; ---------- shimmer: sparkles circling the head ----------
instr 5
  ; one or two full turns around the listener, rising and dipping
  iaz random 0, 360
  iturns random 1, 2
  idir random 0, 1
  iturns = (idir > 0.5 ? iturns : -iturns)
  kaz line iaz, p3, iaz + 360*iturns
  kaz wrap kaz, 0, 360
  kel oscili 25, 1/7.3
  kel = kel + 15
  aenv linseg 0, p3*0.25, 1, p3*0.5, 1, p3*0.25, 0
  ; sparse bright grains, tuned to the scale
  irnd random 0, 7.99
  isemi table int(irnd), giScale
  ifreq = cpsmidinn(86 + isemi)
  kdens randomi 9, 22, 0.5
  agr dust2 1, kdens
  ar1 reson agr, ifreq, ifreq*0.02, 1
  ar2 reson agr, ifreq*2.01, ifreq*0.03, 1
  ahi buthp agr, 5000
  asig = (ar1*0.6 + ar2*0.3 + ahi*0.25) * aenv * 0.35
  kbin chnget "bin"
  kbin port kbin, 0.3
  ; stereo: follow the same circle with a simple pan
  kpan = 0.5 + 0.45*sin(kaz*$M_PI/180)
  aSL, aSR pan2 asig*0.6, kpan
  aBL, aBR hrtfmove2 asig, kaz, kel, gSHL, gSHR, 4, 9, sr
  RoomSend asig, kaz, 0.8*kbin
  aL = aSL*(1-kbin) + aBL*kbin*1.4
  aR = aSR*(1-kbin) + aBR*kbin*1.4
  gaDryL = gaDryL + aL*0.7
  gaDryR = gaDryR + aR*0.7
  gaRevL = gaRevL + aL*0.25
  gaRevR = gaRevR + aR*0.25
endin

; ---------- room: binaural early reflections + late tail ----------
; Listener stands in the middle of a 10 x 10 x 3 m room (+x = right, +y = ahead);
; each bus sounds from 2.2 m away in its quarter.
instr 98
  ir = 2.2
  ic = 5
  ih = 1.7
  ip = ir*0.7071
  a1L, a1R, ilo, ihi, imfp hrtfearly gaQ1, ic+ip, ic+ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  a2L, a2R, i0, i1, i2 hrtfearly gaQ2, ic+ip, ic-ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  a3L, a3R, i3, i4, i5 hrtfearly gaQ3, ic-ip, ic-ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  a4L, a4R, i6, i7, i8 hrtfearly gaQ4, ic-ip, ic+ip, ih, ic, ic, ih, gSHL, gSHR, 1, 8, sr, 1, 1
  aEL = a1L + a2L + a3L + a4L
  aER = a1R + a2R + a3R + a4R
  ; late tail: binaural diffuse reverb, longer than the room's own decay for a dreamy wash
  aTin = (gaQ1 + gaQ2 + gaQ3 + gaQ4)*0.5
  aTL, aTR, idel hrtfreverb aTin, 3.2, 1.6, gSHL, gSHR, sr, imfp, 1
  aTL delay aTL, idel
  aTR delay aTR, idel
  gaDryL = gaDryL + aEL*2.2 + aTL*1.1
  gaDryR = gaDryR + aER*2.2 + aTR*1.1
  clear gaQ1, gaQ2, gaQ3, gaQ4
endin

; ---------- master: reverb, volume, fade-in, soft limit ----------
instr 99
  kvol chnget "vol"
  kvol port kvol, 0.25
  kfade linseg 0, 1.5, 1
  kbm chnget "bin"
  kbm port kbm, 0.3
  aRL, aRR reverbsc gaRevL, gaRevR, 0.9 - 0.08*kbm, 7000 + 4000*kbm
  krv = 0.9 - 0.55*kbm
  ; loudness match: the binaural mix measures quieter, so lift it to stereo level
  kmk = 1 + 0.8*kbm
  aL = (gaDryL + aRL*krv) * kvol * kfade * kmk
  aR = (gaDryR + aRR*krv) * kvol * kfade * kmk
  aL = tanh(aL)
  aR = tanh(aR)
  krms rms aL + aR
  chnset krms, "level"
  outs aL, aR
  clear gaDryL, gaDryR, gaRevL, gaRevR
endin

  about: {
    bio: [
      'Salome Yichi Zhang (b. 2002) is an award-winning Chinese-Canadian composer and sound artist working across sound art, film, and music technology. In New York City, her multichannel and multimedia works have been presented at THE BLANC, Flohaus Gallery, and NYU’s Audio Lab, including work produced by Michael Schumacher. While studying in Boston, her work was presented at Cyber Arts Gallery, Emerson Media Art Studio, and Fenway Art Studio.',
      'Zhang began her composition studies at the University of Toronto on a top-level scholarship before transferring to Berklee College of Music as a recipient of its World Tour Scholarship Award. She earned a B.M. in Electronic Production and Design and Film Scoring and was mentored by Neil Leonard at the Berklee Interdisciplinary Arts Institute. After graduation, she continued working with Leonard as a production assistant on <i>Midtown Sound: Listening Legacy</i>, his solo exhibition at THE BLANC.',
      'She has contributed music and sound to independent features, television productions, and more than 20 short films and animations. She was one of the sound designers on <i>Blue Planet Outside the Window</i>, the first live-action 8K documentary filmed entirely in space, and contributed to <i>Hope You Have a Good Trip</i>, the final feature by internationally acclaimed Tibetan filmmaker Pema Tseden, alongside projects with iQIYI and MIT’s Project Prakash. In 2025, her string quartet composition was featured on the Gaia Quartet’s Canadian tour and presented at the Canadian Music Centre in Toronto.'
    ],
    sections: [
      { title: 'Research', text: [
        'Zhang studies how music carries meaning where words cannot, especially where it meets image and machines. Her research combines music perception with machine learning to understand how composers and listeners align sound with picture, down to where a film’s musical accents land. She also studies how an autonomous system can make music that still feels intentional. Her goal is to build tools that extend a composer’s intuition rather than replace it.'
      ] },

    'scoring-post': { title: 'Scoring & Post', html: function () {

             '<div class="sub">Selected</div>' + rows(S.filmSelected) +
             '<div class="sub">All Film</div>' + rows(S.filmAll) +
             '<div class="sub">Rescore</div>' + rows(S.filmRescore) +
             '<div class="sub">Sound Design & Post</div>' + rows(S.filmPost);
    } },
    'listening-room': { title: 'Listening Room', wide: true, html: function () {
      return '<a class="lr-link" href="#scoring-post">← Scoring & Post</a>' +
             '<div class="track-row" style="opacity:.6"><div>#</div><div>Name</div><div>Player</div><div>Style</div></div>' +
        S.tracks.map(function (t, i) {
          var n = (i + 1 < 10 ? '0' : '') + (i + 1);
          return '<div class="track-row"><div>' + n + '</div><div>' + esc(t[0]) + '</div>' +
                 '<div class="pl" data-src="' + esc(t[2]) + '" data-d="' + (t[3] || 0) + '"><button class="pb" type="button" aria-label="Play">▶</button>' +
                 '<div class="bar"><i></i></div><span class="t">0:00 / ' + fmt(t[3] || 0) + '</span></div>' +
                 '<div>' + esc(t[1]) + '</div></div>';
        }).join('');
    } },
    'about': { title: S.name, wide: true, html: function () {
      var A = S.about;
      var secs = A.sections.map(function (s) {
        var inner = s.text ? s.text.map(function (t) { return '<p>' + t + '</p>'; }).join('') : s.rows.map(ent).join('');
        return '<div class="sec"><h3>' + esc(s.title) + '</h3>' + inner + '</div>';
      }).join('');
      return '<div class="about"><div><img src="' + esc(S.media.photo) + '" alt="Salome Yichi Zhang" onerror="var a=this.closest(\'.about\');a.classList.add(\'nophoto\');this.parentNode.remove()"></div>' +
             '<div><h2>' + esc(S.name) + '</h2><p class="roles">' + esc(S.roles) + '</p>' +
             A.bio.map(function (t) { return '<p>' + t + '</p>'; }).join('') + '</div></div>' + secs +
             '<a class="cvlink lr-link" href="' + esc(S.media.cv) + '" target="_blank" rel="noopener">View Full CV ↗</a>';
    } },
    'contact': { title: 'Contact', html: function () {
      var C = S.contact;
      return '<div class="contact"><div><div class="k">Contact</div>' +
             '<a href="mailto:' + esc(C.email) + '">' + esc(C.email) + '</a><br><br>' + esc(C.phone) + '</div>' +
             '<div><div class="k">Based in</div>' + esc(C.based) + '</div></div>' +
             '<p style="margin-top:18px;opacity:.6">© 2026 ' + esc(S.name) + '</p>';
    } }
  };

  /* ---------- work pages (third layer) ---------- */
  var PARENT = { art: 'Art', lab: 'Lab', 'scoring-post': 'Scoring & Post' };
  function workView(k) {
    var w = S.works && S.works[k];
    if (!w) return null;
    return { title: w.title, wide: true, quiet: !!(w.vimeo || w.video || (w.audio && w.audio.length)), html: function () {
      var h = '<a class="lr-link" href="#' + w.parent + '">← ' + esc(PARENT[w.parent] || 'Back') + '</a><div class="work">';
      h += '<h2>' + esc(w.title) + '</h2>' + (w.sub ? '<p class="meta">' + esc(w.sub) + '</p>' : '');
      if (w.vimeo) {
        h += '<div class="vid"><iframe src="https://player.vimeo.com/video/' + esc(w.vimeo) +
             '?dnt=1&title=0&byline=0&portrait=0&color=ffd27a" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy" title="' + esc(w.title) + '"></iframe></div>';
      }
      else if (w.video) {
        h += '<div class="vid"><video controls playsinline preload="metadata"' + (w.video.poster ? ' poster="' + esc(w.video.poster) + '"' : '') +
             ' src="' + esc(w.video.src) + '"></video></div>';
      }
      function fig(im, cls) {
        return '<figure' + (cls ? ' class="' + cls + '"' : '') + '><img src="' + esc(im.src) + '" alt="' + esc(im.alt || w.title) + '" loading="lazy">' +
               (im.alt ? '<figcaption>' + esc(im.alt) + '</figcaption>' : '') + '</figure>';
      }
      var hasVid = !!(w.vimeo || w.video);
      if (w.image && !hasVid) h += fig(w.image);
      (w.desc || []).forEach(function (p) { h += '<p>' + esc(p) + '</p>'; });
      if (w.image && hasVid && w.imageWithVideo) h += fig(w.image, 'side');
      if (w.image2) h += fig(w.image2);
      var f = [['Year', w.year], ['Role', w.role], ['Details', w.note]].filter(function (x) { return x[1]; });
      if (f.length) h += '<dl class="facts">' + f.map(function (x) { return '<dt>' + x[0] + '</dt><dd>' + esc(x[1]) + '</dd>'; }).join('') + '</dl>';
      if (w.audio && w.audio.length) {
        h += '<div class="wa"><div class="sub" style="margin-top:0">Listen</div>' + w.audio.map(function (a) {
          return '<div class="track-row"><div>' + esc(a.title) + '</div>' +
                 '<div class="pl" data-src="' + esc(a.src) + '" data-d="' + (a.dur || 0) + '"><button class="pb" type="button" aria-label="Play">▶</button>' +
                 '<div class="bar"><i></i></div><span class="t">0:00 / ' + fmt(a.dur || 0) + '</span></div></div>';
        }).join('') + '</div>';
      }
      var L = (w.docs || []).concat(w.links || []);
      if (L.length) h += '<div class="wd">' + L.map(function (d) {
        return '<a class="lr-link" href="' + esc(d.href) + '" target="_blank" rel="noopener"' + (d.download ? ' download' : '') + '>' + esc(d.label) + ' ↗</a>';
      }).join('') + '</div>';
      if (w.tags && w.tags.length) h += '<div class="tags">' + w.tags.map(function (t) { return '<span>' + esc(t) + '</span>'; }).join('') + '</div>';
      if (!hasVid && !w.image && !(w.audio && w.audio.length) && !(w.desc && w.desc.length)) h += '<p class="soon">Media coming soon.</p>';
      return h + '</div>';
    } };
  }

  var current = null, currentQuiet = false;
  function openWin(name) {
    var v = VIEWS[name] || (name.indexOf('w/') === 0 ? workView(name.slice(2)) : null);
    if (!v) { closeWin(); return; }
    stopTracks();
    current = name; currentQuiet = !!v.quiet;
    $('panelTitle').textContent = v.title;
    $('panelBody').innerHTML = v.html();
    $('panelBody').scrollTop = 0;
    $('panel').classList.toggle('wide', !!v.wide);
    $('panel').classList.add('show');
    document.body.classList.add('has-window');
    if (location.hash !== '#' + name) { try { history.replaceState(null, '', '#' + name); } catch (e) {} }
    applyVol();
  }
  function closeWin() {
    stopTracks();
    current = null; currentQuiet = false;
    $('panel').classList.remove('show');
    document.body.classList.remove('has-window');
    if (location.hash && location.hash !== '#tune') { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) {} }
    applyVol();
  }
  $('close').addEventListener('click', closeWin);
  document.addEventListener('click', function (e) {
    if (current && !e.target.closest('#panel, #icons, #banner, .controls, #codepanel, #tune, #enter')) closeWin();
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeWin(); });
  window.addEventListener('hashchange', route);
  function route() {
    var h = location.hash.slice(1);
    if (VIEWS[h] || (h.indexOf('w/') === 0 && workView(h.slice(2)))) openWin(h); else if (current) closeWin();
  }

  /* listening room players */
  function fmt(x) { x = Math.max(0, Math.floor(x || 0)); return Math.floor(x / 60) + ':' + ('0' + x % 60).slice(-2); }
  var player = new Audio(), cur = null;
  player.preload = 'auto';
  function dur(pl) { return (isFinite(player.duration) && cur === pl && player.duration) || +pl.getAttribute('data-d') || 0; }
  function paint(pl, t) {
    var d = dur(pl);
    pl.querySelector('.bar i').style.width = (d ? Math.min(100, t / d * 100) : 0) + '%';
    pl.querySelector('.t').textContent = fmt(t) + ' / ' + fmt(d);
  }
  function setBtn(pl, playing) {
    var b = pl.querySelector('.pb'); b.textContent = playing ? '❚❚' : '▶';
    b.setAttribute('aria-label', playing ? 'Pause' : 'Play'); pl.classList.toggle('on', playing);
  }
  function stopTracks() { player.pause(); if (cur) { setBtn(cur, false); paint(cur, 0); } cur = null; }
  function load(pl) {
    if (cur === pl) return;
    stopTracks(); cur = pl; player.src = pl.getAttribute('data-src');
  }
  function play(pl) {
    load(pl);
    player.play().then(function () { setBtn(pl, true); })
      .catch(function () { pl.classList.add('bad'); pl.querySelector('.t').textContent = 'unavailable'; });
  }
  $('panelBody').addEventListener('click', function (e) {
    var b = e.target.closest('.pb'); if (!b) return;
    var pl = b.closest('.pl');
    if (cur === pl && !player.paused) { player.pause(); setBtn(pl, false); } else play(pl);
  });
  var seeking = null;
  function seekTo(e) {
    var r = seeking.querySelector('.bar').getBoundingClientRect();
    var t = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * dur(seeking);
    paint(seeking, t);
    if (cur === seeking) { try { player.currentTime = t; } catch (x) {} }
    return t;
  }
  $('panelBody').addEventListener('pointerdown', function (e) {
    var bar = e.target.closest('.bar'); if (!bar) return;
    var pl = bar.closest('.pl'); seeking = pl;
    bar.setPointerCapture(e.pointerId); e.preventDefault();
    var wasPlaying = cur === pl && !player.paused;
    if (cur !== pl) { load(pl); var t = seekTo(e); player.addEventListener('loadedmetadata', function f() { player.removeEventListener('loadedmetadata', f); player.currentTime = t; }); play(pl); }
    else { seekTo(e); if (!wasPlaying) play(pl); }
  });
  $('panelBody').addEventListener('pointermove', function (e) { if (seeking) seekTo(e); });
  ['pointerup', 'pointercancel'].forEach(function (n) { $('panelBody').addEventListener(n, function () { seeking = null; }); });
  player.addEventListener('timeupdate', function () { if (cur && !seeking) paint(cur, player.currentTime); });
  player.addEventListener('loadedmetadata', function () { if (cur) paint(cur, player.currentTime); });
  player.addEventListener('ended', stopTracks);
  ['play', 'pause', 'ended'].forEach(function (n) { player.addEventListener(n, applyVol); });

  /* ---------- draggable statement ---------- */
  var root = document.documentElement, drag = null;
  var tuneMode = /tune/.test(location.search) || location.hash === '#tune';
  function pos() {
    var r = $('readme').getBoundingClientRect();
    return [Math.round(r.left / innerWidth * 1000) / 10, Math.round(r.top / innerHeight * 1000) / 10];
  }
  $('readmeBar').addEventListener('pointerdown', function (e) {
    if (innerWidth <= 600) return;
    var r = $('readme').getBoundingClientRect();
    drag = { dx: e.clientX - r.left, dy: e.clientY - r.top };
    $('readme').classList.add('dragging');
    $('readmeBar').setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  $('readmeBar').addEventListener('pointermove', function (e) {
    if (!drag) return;
    var w = $('readme').offsetWidth, h = $('readme').offsetHeight;
    var x = Math.min(Math.max(e.clientX - drag.dx, 8), innerWidth - w - 8);
    var y = Math.min(Math.max(e.clientY - drag.dy, 52), innerHeight - h - 8);
    root.style.setProperty('--rx', (x / innerWidth * 100) + 'vw');
    root.style.setProperty('--ry', (y / innerHeight * 100) + 'vh');
    showTune();
  });
  var moved = false;
  function placeDefault() {
    if (moved || innerWidth <= 600) return;
    var h = $('readme').offsetHeight;
    var y = Math.max(56, Math.min(innerHeight * 0.6, innerHeight - h - 70));
    root.style.setProperty('--ry', y + 'px');
  }
  placeDefault(); addEventListener('resize', placeDefault);
  if (document.fonts) document.fonts.ready.then(placeDefault);
  function endDrag() { if (drag) moved = true; drag = null; $('readme').classList.remove('dragging'); }
  $('readmeBar').addEventListener('pointerup', endDrag);
  $('readmeBar').addEventListener('pointercancel', endDrag);

  /* ---------- tuning panel (?tune or #tune) ---------- */
  var T = { bri: .57, sat: 1.4, con: 1.14, icon: .55 };
  function showTune() {
    if (!tuneMode) return;
    var p = pos();
    $('tuneOut').textContent = 'BRI ' + T.bri + '  SAT ' + T.sat + '  CON ' + T.con + '  ICON ' + T.icon + '  POS ' + p[0] + ' ' + p[1];
  }
  if (tuneMode) {
    $('tune').style.display = 'block';
    [].forEach.call(document.querySelectorAll('#tune input'), function (inp) {
      var k = inp.getAttribute('data-k'); inp.value = T[k];
      inp.addEventListener('input', function () { T[k] = parseFloat(inp.value); root.style.setProperty('--' + k, T[k]); showTune(); });
    });
    showTune();
  }

  /* ---------- Tide: generative Csound ---------- */
  var CSD = $('csd').textContent.trim();
  var cs = null, muted = false, VOL = 0.8;
  /* Tide plays everywhere except the Listening Room, work pages with video/audio, or while a track plays */
  function quiet() { return current === 'listening-room' || currentQuiet || (typeof player !== 'undefined' && player && !player.paused); }
  function applyVol() { if (cs) { try { cs.setControlChannel('vol', (muted || quiet()) ? 0 : VOL); } catch (e) {} } }
  function seen() { try { return sessionStorage.getItem('tideSeen') === '1'; } catch (e) { return false; } }
  function markSeen() { try { sessionStorage.setItem('tideSeen', '1'); } catch (e) {} }
  function hideEnter() {
    markSeen();
    $('enter').style.opacity = '0'; $('enter').style.pointerEvents = 'none';
    setTimeout(function () { $('enter').style.display = 'none'; }, 750);
  }
  function showEnter() { $('enter').style.display = 'flex'; $('enter').style.opacity = '1'; $('enter').style.pointerEvents = 'auto'; }
  /* ENTER always shows on arrival: browsers only allow sound after a click */
  $('skip').addEventListener('click', hideEnter);
  $('go').addEventListener('click', boot);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && $('enter').style.display !== 'none' && $('enter').style.opacity !== '0' && !$('go').disabled) { e.preventDefault(); boot(); }
  });
  $('snd').addEventListener('click', function () {
    if (!cs) { boot(); return; }
    muted = !muted; $('snd').textContent = muted ? 'SOUND OFF' : 'SOUND ON'; applyVol();
  });
  $('binBtn').addEventListener('click', function () {
    bin = bin ? 0 : 1;
    $('binBtn').textContent = bin ? '3D ON' : '3D OFF';
    if (cs) { try { cs.setControlChannel('bin', bin); } catch (e) {} }
  });
  var codeOpen = false;
  $('codeBtn').addEventListener('click', function () {
    var pre = $('codepanel');
    if (!pre.innerHTML) {
      pre.innerHTML = '<span style="letter-spacing:.1em">Csound · generated live in your browser, never the same twice</span>\n\n' +
        CSD.split('\n').map(function (l) {
          var i = l.indexOf(';');
          return i < 0 ? esc(l) : esc(l.slice(0, i)) + '<span class="c">' + esc(l.slice(i)) + '</span>';
        }).join('\n');
    }
    codeOpen = !codeOpen;
    pre.style.display = codeOpen ? 'block' : 'none';
    $('codeBtn').textContent = codeOpen ? 'HIDE CODE' : 'CODE';
  });
  /* HRTF data sets, one per sample rate; 44.1 and 48 kHz are preloaded */
  var hrtfCache = {};
  function hrtfSet(rate) {
    if (!hrtfCache[rate]) {
      hrtfCache[rate] = Promise.all(['left', 'right'].map(function (ear) {
        var f = 'hrtf-' + rate + '-' + ear + '.dat';
        return fetch('media/hrtf/' + f).then(function (r) { if (!r.ok) throw new Error(f); return r.arrayBuffer(); })
          .then(function (b) { return [f, new Uint8Array(b)]; });
      }));
      hrtfCache[rate].catch(function () {});
    }
    return hrtfCache[rate];
  }
  hrtfSet(44100); hrtfSet(48000);
  var bin = 1;
  var modP = import('https://cdn.jsdelivr.net/npm/@csound/browser@6.18.7/dist/csound.js');
  modP.catch(function () {});
  async function boot() {
    $('go').disabled = true; $('note').textContent = 'starting…';
    try {
      var mod = await modP;
      var make = async function (opts) {
        var c = await mod.Csound(opts);
        if (await c.compileCsdText(CSD) !== 0) throw new Error('compile failed');
        var rate = Math.round(await c.getSr());
        var set = [44100, 48000, 96000].indexOf(rate) >= 0 ? await hrtfSet(rate) : [];
        if (!set.length) { bin = 0; $('binBtn').textContent = '3D OFF'; }  /* unusual rate: fall back to stereo */
        for (var k = 0; k < set.length; k++) await c.fs.writeFile(set[k][0], set[k][1]);
        await c.setControlChannel('bin', bin);
        await c.setControlChannel('vol', 0);
        await c.setControlChannel('cut', 3750);
        await c.start();
        return c;
      };
      try { cs = await make({}); }
      catch (e1) { $('note').textContent = 'switching audio mode…'; cs = await make({ useSPN: true }); }
      muted = false; $('snd').textContent = 'SOUND ON'; applyVol();
      hideEnter();
    } catch (e) {
      console.error('Tide:', e);
      $('note').textContent = 'Sound could not start in this browser.';
      setTimeout(hideEnter, 1800);
    }
  }

  route();
})();
</script>
</body>
</html>
