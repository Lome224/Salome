<!DOCTYPE html>
<html lang="en" data-tide-embed>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salome Yichi Zhang · Creative Technologist, Researcher, Composer</title>
<meta name="description" content="Salome Yichi Zhang: creative technologist, researcher and composer working across kinetic sound sculpture, generative sound, music cognition and film.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://tide.salomezhang.com/controller.css">
<!-- Csound is the largest thing Tide needs: start fetching it at once -->
<link rel="modulepreload" href="https://tide.salomezhang.com/vendor/csound.js" crossorigin>
</head>
<body>
<video id="bg" muted loop playsinline autoplay preload="auto"></video>

<header class="banner glass" id="banner" aria-label="Salome Yichi Zhang · Creative Technologist · Researcher · Composer">
  <div class="track" id="track"></div>
</header>

<section class="win" id="readme" aria-label="Artist statement">
  <div class="bar" id="readmeBar"><span class="dot" aria-hidden="true"></span>readme.txt</div>
  <div class="body" id="statement"></div>
</section>

<nav class="icons" id="icons" aria-label="Sections"></nav>

<section class="win" id="panel" role="dialog" aria-modal="false" aria-labelledby="panelTitle">
  <div class="bar"><button class="x" id="close" aria-label="Close"></button><span id="panelTitle"></span></div>
  <div class="body" id="panelBody"></div>
</section>

<!-- Tide: the generative piece that plays on this site. Its code lives at tide.salomezhang.com;
     the controls below are wired up by the script loaded at the end of the page. -->
<div class="controls" id="tide">
  <div class="tide-now"><span class="meter" aria-hidden="true"><i id="meter"></i></span><span id="status"></span> <span id="now"></span></div>
  <div class="tide-bar">
    <button class="glass glowable" id="play" type="button">PLAY</button>
    <label class="glass" for="vol">VOLUME <input type="range" id="vol" min="0" max="1" step="0.01"><output id="volOut"></output></label>
    <button class="glass glowable" id="bin" type="button" aria-pressed="true" title="Binaural (HRTF) spatial audio: sounds move around your head. Headphones recommended; switch off for speakers."><span id="binTxt">BINAURAL ON</span></button>
  </div>
</div>

<section class="win" id="controller" aria-label="Tide" hidden style="display:none">
  <div class="bar"><button class="x" id="tideClose" type="button" aria-label="Close"></button>Tide</div>
  <div class="body" id="controllerBody"></div>
  </div>
</section>

<div id="enter">
  <button class="go glass glowable" id="go" type="button">ENTER</button>
  <p class="sub">Binaural sound · best with headphones</p>
  <button class="skip" id="skip" type="button">enter without sound</button>
  <div class="note" id="note"></div>
</div>

<div id="tune">
  <h4>BACKDROP</h4>
  <label><span>Brightness</span><input type="range" min="0" max="1" step=".01" data-k="bri"></label>
  <label><span>Colour</span><input type="range" min="0" max="1.5" step=".01" data-k="sat"></label>
  <label><span>Contrast</span><input type="range" min=".5" max="2" step=".01" data-k="con"></label>
  <h4>INTERFACE</h4>
  <label><span>Icon grey</span><input type="range" min="0" max="1" step=".01" data-k="icon"></label>
  <h4>STATEMENT</h4>
  <div>Drag the readme.txt bar to move it.</div>
  <output id="tuneOut"></output>
</div>

<script src="content.js"></script>
<script src="site.js"></script>
<script src="tide.js"></script>
<script type="module" src="https://tide.salomezhang.com/js/main.js"></script>
</body>
</html>
